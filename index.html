      const pl = this.players[p];
      if (this.sorcerySpeed(p) && !pl.landPlayed) {
        const seen = new Set();
        for (const c of pl.hand) if (c.def.type === 'land' && !seen.has(c.def.id)) { seen.add(c.def.id); acts.push({ type: 'land', uid: c.uid }); }
      }
      const seenCast = new Set();
      for (const c of pl.hand) {
        if (!this.canCast(p, c) || seenCast.has(c.def.id)) continue;
        seenCast.add(c.def.id);
        const eff = c.def.spell;
        if (eff && eff.tgt) for (const t of this.legalTargets(p, eff.tgt, c)) acts.push({ type: 'cast', uid: c.uid, target: t });
        else acts.push({ type: 'cast', uid: c.uid });
      }
      for (const q of this.battlefield) {
        if (!this.canActivate(p, q)) continue;
        for (const t of this.legalTargets(p, q.def.act.eff.tgt, q)) acts.push({ type: 'act', uid: q.uid, target: t });
      }
      return acts;
    }
    hasResponse(p) {
      const pl = this.players[p];
      for (const c of pl.hand) if (c.def.type === 'instant' && this.canCast(p, c)) return true;
      for (const q of this.battlefield) if (this.canActivate(p, q)) return true;
      return false;
    }

    async doAction(p, a) {
      const pl = this.players[p];
      if (a.type === 'land') {
        const c = pl.hand.find(x => x.uid === a.uid);
        if (!c || !this.canPlayLand(p, c)) return false;
        pl.hand.splice(pl.hand.indexOf(c), 1);
        this.putOntoBattlefield(c, p, !!c.def.etbTapped); pl.landPlayed = true;
        this.log(pl.name + ' jogou ' + c.def.name + '.', p, { card: c.def.id, kind: 'land' });
        this.emit('change'); await this.pace('land', { p, card: c });
        return true;
      }
      if (a.type === 'cast') {
        const c = pl.hand.find(x => x.uid === a.uid);
        if (!c || !this.canCast(p, c)) return false;
        const eff = c.def.spell;
        if (eff && eff.tgt) {
          if (!a.target || !this.legalTargets(p, eff.tgt, c).some(t => this.sameTarget(t, a.target))) return false;
        }
        this.pay(p, c.def.cost);
        pl.hand.splice(pl.hand.indexOf(c), 1);
        const item = { sid: this.sidN++, kind: 'spell', card: c, controller: p, eff: eff || {}, target: a.target || null, name: c.def.name };
        this.stack.push(item);
        this.stats.spells[p]++;
        this.log(pl.name + ' conjurou ' + c.def.name + (a.target ? ' → ' + this.targetName(a.target) : '') + '.', p, { card: c.def.id, kind: 'cast' });
        this.emit('stack'); this.emit('change'); await this.pace('cast', { p, item });
        return true;
      }
      if (a.type === 'act') {
        const q = this.perm(a.uid);
        if (!q || !this.canActivate(p, q)) return false;
        const eff = q.def.act.eff;
        if (!a.target || !this.legalTargets(p, eff.tgt, q).some(t => this.sameTarget(t, a.target))) return false;
        q.tapped = true;
        const item = { sid: this.sidN++, kind: 'ability', source: q, controller: p, eff, target: a.target, name: q.def.name + ' (habilidade)' };
        this.stack.push(item);
        this.log(pl.name + ' ativou ' + q.def.name + ' → ' + this.targetName(a.target) + '.', p, { card: q.def.id, kind: 'act' });
        this.emit('stack'); this.emit('change'); await this.pace('cast', { p, item });
        return true;
      }
      return false;
    }

    /* ---------- gatilhos ---------- */
    async flushTriggers() {
      while (this.pending.length) {
        const list = this.pending.splice(0);
        // APNAP: ativo primeiro na pilha (resolve por último)
        list.sort((a, b) => (a.controller === this.active ? 0 : 1) - (b.controller === this.active ? 0 : 1));
        for (const tr of list) {
          const item = Object.assign({ sid: this.sidN++ }, tr);
          if (tr.eff.tgt) {
            const legal = this.legalTargets(tr.controller, tr.eff.tgt, tr.source);
            if (!legal.length) continue;
            const t = await this.agents[tr.controller].chooseTarget(this, tr.controller, item, legal);
            if (!t || !legal.some(x => this.sameTarget(x, t))) { this.log(tr.name + ': nenhum alvo escolhido.', tr.controller); continue; }
            item.target = t;
          }
          this.stack.push(item);
          this.log('Gatilho: ' + tr.name + (item.target ? ' → ' + this.targetName(item.target) : '') + '.', tr.controller, { card: tr.source.def.id, kind: 'trigger' });
          this.emit('stack');
        }
        this.emit('change');
      }
    }

    /* ---------- resolução ---------- */
    async resolveTop() {
      const item = this.stack.pop(); if (!item) return;
      const pl = this.players[item.controller];
      this.emit('resolving', { item });
      if (item.target && !this.targetStillLegal(item)) {
        this.log(item.name + ' não resolveu: o alvo não é mais válido.', item.controller);
        if (item.kind === 'spell') this.players[item.card.owner].gy.push(item.card);
      } else {
        if (item.kind === 'spell') {
          const d = item.card.def;
          if (d.type === 'creature' || d.type === 'enchantment') {
            this.putOntoBattlefield(item.card, item.controller, false);
            this.log(d.name + ' entrou no campo de ' + pl.name + '.', item.controller, { card: d.id, kind: 'enter' });
          } else {
            if (item.target) await this.pace('spell', { item });
            await this.applyEffect(item, item.eff);
            if (this.stack.includes(item)) { /* nada */ }
            this.players[item.card.owner].gy.push(item.card);
          }
        } else {
          if (item.target) await this.pace('spell', { item });
          await this.applyEffect(item, item.eff);
        }
      }
      this.emit('stack'); this.emit('change');
      await this.pace('resolve', { item });
      await this.checkSBA();
      await this.flushTriggers();
    }

    targetPerm(item) { return item.target && item.target.t === 'perm' ? this.perm(item.target.uid) : null; }

    async applyEffect(item, eff) {
      const p = item.controller, o = this.opp(p), pl = this.players[p];
      switch (eff.k) {
        case 'seq': for (const e of eff.list) await this.applyEffect(item, e); break;
        case 'draw': await this.draw(p, eff.n); this.log(pl.name + ' comprou ' + eff.n + (eff.n > 1 ? ' cartas.' : ' carta.'), p); break;
        case 'scry': {
          const n = Math.min(eff.n, pl.library.length); if (!n) break;
          const cards = pl.library.slice(0, n);
          const res = await this.agents[p].chooseScry(this, p, cards);
          const top = (res && res.top || []).map(u => cards.find(c => c.uid === u)).filter(Boolean);
          const bottom = cards.filter(c => !top.includes(c));
          pl.library.splice(0, n);
          pl.library.unshift(...top); pl.library.push(...bottom);
          this.log(pl.name + ' fez vidência ' + n + ': ' + top.length + ' no topo, ' + bottom.length + ' no fundo.', p);
          break;
        }
        case 'bounce': {
          const q = this.targetPerm(item); if (!q) break;
          this.removeFromBattlefield(q); this.players[q.owner].hand.push(q);
          this.log(q.def.name + ' voltou para a mão de ' + this.players[q.owner].name + '.', p);
          break;
        }
        case 'counter': case 'counterUnless': {
          const s = this.stack.find(x => x.sid === item.target.sid); if (!s) break;
          if (eff.k === 'counterUnless') {
            const payer = s.controller;
            if (this.canPay(payer, { g: eff.n, c: {} })) {
              const yes = await this.agents[payer].choosePay(this, payer, eff.n, s);
              if (yes && this.pay(payer, { g: eff.n, c: {} })) { this.log(this.players[payer].name + ' pagou ' + eff.n + ' e ' + s.name + ' não foi anulada.', payer); break; }
            }
          }
          this.stack.splice(this.stack.indexOf(s), 1);
          if (s.kind === 'spell') this.players[s.card.owner].gy.push(s.card);
          this.log(s.name + ' foi anulada.', p, { kind: 'counter' });
          break;
        }
        case 'seiva': { const q = this.perm(eff.uid); if (q) { q.counters = (q.counters || 0) + 1; this.log(q.def.name + ' recebeu um marcador +1/+1.', p); } pl.life += 1; this.emit('life', { p, d: 1 }); break; }
        case 'gain': pl.life += eff.n; this.log(pl.name + (eff.n < 0 ? ' perdeu ' + (-eff.n) : ' ganhou ' + eff.n) + ' de vida.', p); this.emit('life', { p, d: eff.n }); break;
        case 'pump': {
          const q = this.targetPerm(item); if (!q) break;
          q.mods.push({ p: eff.p, t: eff.t, kw: eff.kw || [] });
          this.log(q.def.name + ' ganhou +' + eff.p + '/+' + eff.t + (eff.kw ? ' e ' + eff.kw.map(k => KWN[k].toLowerCase()).join(', ') : '') + '.', p);
          break;
        }
        case 'teamPump': for (const q of this.creatures(p)) q.mods.push({ p: eff.p, t: eff.t, kw: eff.kw || [] }); this.log('Criaturas de ' + pl.name + ' ganharam +' + eff.p + '/+' + eff.t + (eff.kw ? ' e ' + eff.kw.map(k => KWN[k].toLowerCase()).join(', ') : '') + '.', p); break;
        case 'fetchLand': {
          const lands = pl.library.filter(c => c.def.type === 'land'); if (!lands.length) break;
          lands.sort((a, b) => (b.def.colors ? 1 : 0) - (a.def.colors ? 1 : 0));
          const counts = {}; for (const q of this.lands(p)) counts[q.def.color] = (counts[q.def.color] || 0) + 1;
          lands.sort((a, b) => (counts[a.def.color] || 0) - (counts[b.def.color] || 0));
          const c = lands[0]; pl.library.splice(pl.library.indexOf(c), 1); this.shuffle(pl.library);
          this.putOntoBattlefield(c, p, !eff.untapped);
          this.log(pl.name + ' pôs ' + c.def.name + ' no campo' + (eff.untapped ? '' : ', virado') + '.', p);
          break;
        }
        case 'dmg': this.dealDamage(item, item.target, eff.n); break;
        case 'dmgAll': for (const q of this.creatures()) { q.damage += eff.n; this.emit('hit', { uid: q.uid, n: eff.n }); } this.log((item.name) + ' causou ' + eff.n + ' de dano a cada criatura.', p); break;
        case 'mill': {
          const who = eff.who === 'self' ? p : o;
          const m = this.mill(who, eff.emptyHand && !this.players[who].hand.length ? eff.emptyHand : eff.n);
          this.log(this.players[who].name + ' queimou ' + m.length + ' carta(s) do grimório' + (m.length ? ': ' + m.map(c => c.def.name).join(', ') : '') + '.', p, { kind: 'mill' });
          break;
        }
        case 'discard': {
          const opl = this.players[o]; const n = Math.min(eff.n, opl.hand.length); if (!n) { this.log(opl.name + ' não tinha cartas para descartar.', p); break; }
          let uids;
          if (eff.pick) {
            const opts = opl.hand.filter(c => c.def.type !== 'land');
            this.log(opl.name + ' revelou a mão: ' + (opl.hand.map(c => c.def.name).join(', ') || 'vazia') + '.', o);
            if (!opts.length) break;
            const u = await this.agents[p].choosePick(this, p, opts, 'descartar');
            uids = [opts.some(c => c.uid === u) ? u : opts[0].uid];
          } else uids = await this.agents[o].chooseDiscard(this, o, n, 'efeito');
          uids = (uids || []).filter(u => opl.hand.some(c => c.uid === u)).slice(0, n);
          while (uids.length < n) { const c = opl.hand.find(x => !uids.includes(x.uid)); uids.push(c.uid); }
          const names = [];
          for (const u of uids) { const c = opl.hand.find(x => x.uid === u); opl.hand.splice(opl.hand.indexOf(c), 1); opl.gy.push(c); names.push(c.def.name); }
          this.log(opl.name + ' descartou ' + names.join(', ') + '.', o, { kind: 'discard' });
          break;
        }
        case 'raiseDead': {
          const t = item.target; const c = pl.gy.find(x => x.uid === t.uid); if (!c) break;
          pl.gy.splice(pl.gy.indexOf(c), 1); pl.hand.push(c);
          this.log(c.def.name + ' voltou do cemitério para a mão de ' + pl.name + '.', p);
          break;
        }
        case 'reanimate': {
          const t = item.target; const gy = this.players[t.owner].gy; const c = gy.find(x => x.uid === t.uid); if (!c) break;
          gy.splice(gy.indexOf(c), 1);
          this.putOntoBattlefield(c, p, false);
          this.log(c.def.name + ' voltou dos mortos sob o controle de ' + pl.name + '.', p);
          break;
        }
        case 'destroy': {
          const q = this.targetPerm(item); if (!q) break;
          this.toGraveyard(q); this.log(q.def.name + ' foi destruída.', p, { kind: 'exile' });
          break;
        }
        case 'exile': {
          const q = this.targetPerm(item); if (!q) break;
          this.removeFromBattlefield(q); this.players[q.owner].exile.push(q);
          this.log(q.def.name + ' foi exilada.', p, { kind: 'exile' });
          break;
        }
      }
    }

    dealDamage(item, t, n) {
      if (!t) return;
      if (t.t === 'player') {
        this.players[t.p].life -= n; this.stats.dmg[item.controller] += n;
        this.log(item.name + ' causou ' + n + ' de dano a ' + this.players[t.p].name + '.', item.controller, { kind: 'dmg' });
        this.emit('life', { p: t.p, d: -n });
      } else if (t.t === 'perm') {
        const q = this.perm(t.uid); if (!q) return;
        q.damage += n; this.emit('hit', { uid: q.uid, n });
        this.log(item.name + ' causou ' + n + ' de dano a ' + q.def.name + '.', item.controller, { kind: 'dmg' });
      }
    }

    /* ---------- ações baseadas em estado ---------- */
    async checkSBA() {
      let changed = true;
      while (changed) {
        changed = false;
        for (const q of this.creatures()) {
          if (this.toughness(q) <= 0 || q.damage >= this.toughness(q) || (q.dt && q.damage > 0 && !this.hasKw(q, 'casca'))) {
            this.toGraveyard(q); changed = true;
            this.log(q.def.name + ' morreu.', q.owner, { kind: 'die' });
          }
        }
      }
      const lost = this.players.map(pl => pl.life <= 0 || pl.drewFromEmpty);
      if (lost[0] || lost[1]) {
        this.winner = lost[0] && lost[1] ? 'draw' : (lost[0] ? 1 : 0);
        const l = lost[0] ? this.players[0] : this.players[1];
        this.endReason = l.drewFromEmpty ? 'grimorio' : 'vida';
        this.emit('change');
        throw new GameOver();
      }
      this.emit('change');
    }

    /* ---------- prioridade ---------- */
    async priority(win) {
      this.window = win;
      let p = this.active, passes = 0, guard = 0;
      await this.flushTriggers();
      while (true) {
        if (++guard > 400) return;
        this.priorityPlayer = p; this.emit('priority', { p, win });
        let a;
        try { a = await this.agents[p].priority(this, p, win); } catch (e) { if (e && e.isGameOver) throw e; console.error(e); a = { type: 'pass' }; }
        if (!a || a.type === 'pass') {
          passes++;
          if (passes >= 2) {
            if (!this.stack.length) { this.priorityPlayer = null; return; }
            await this.resolveTop(); passes = 0; p = this.active; continue;
          }
          p = this.opp(p); continue;
        }
        const ok = await this.doAction(p, a);
        if (!ok) { passes++; if (passes >= 2) { if (!this.stack.length) { this.priorityPlayer = null; return; } await this.resolveTop(); passes = 0; p = this.active; continue; } p = this.opp(p); continue; }
        passes = 0;
        await this.checkSBA();
        await this.flushTriggers();
      }
    }

    /* ---------- combate ---------- */
    canAttack(q) { return this.isCreature(q) && !q.tapped && !this.isSick(q); }
    canBlockAttacker(b, a) {
      if (!this.isCreature(b) || b.tapped) return false;
      if (this.hasKw(a, 'voar') && !this.hasKw(b, 'voar') && !this.hasKw(b, 'alcance')) return false;
      return true;
    }
    attackersOf() { return this.combat ? this.combat.attackers.map(u => this.perm(u)).filter(Boolean) : []; }
    blockersOf(a) { const out = []; if (!this.combat) return out; for (const b in this.combat.blocks) if (this.combat.blocks[b] === a.uid) { const q = this.perm(+b); if (q) out.push(q); } return out; }

    async doCombat() {
      const a = this.active, d = this.opp(a);
      this.phase = 'combate'; this.window = 'combat';
      const cands = this.creatures(a).filter(q => this.canAttack(q));
      this.emit('phase', { phase: 'combate' });
      if (!cands.length) return;
      await this.pace('phase', { phase: 'combate' });
      let att = await this.agents[a].chooseAttackers(this, a);
      att = (att || []).filter(u => cands.some(q => q.uid === u));
      if (!att.length) { this.log(this.players[a].name + ' não atacou.', a); return; }
      this.combat = { attackers: att.slice(), blocks: {} };
      for (const u of att) { const q = this.perm(u); q.attacking = true; if (!this.hasKw(q, 'vigilancia')) q.tapped = true; }
      this.log(this.players[a].name + ' atacou com ' + att.map(u => this.perm(u).def.name).join(', ') + '.', a, { kind: 'attack' });
      this.phase = 'atacantes'; this.emit('phase', { phase: 'atacantes' }); this.emit('change');
      await this.pace('attack');
      await this.priority('attackers');
      // bloqueios
      this.phase = 'bloqueadores'; this.emit('phase', { phase: 'bloqueadores' });
      const live = this.attackersOf();
      if (live.length) {
        const map = (await this.agents[d].chooseBlocks(this, d)) || {};
        const used = new Set();
        for (const bu in map) {
          const b = this.perm(+bu), at = this.perm(map[bu]);
          if (!b || !at || b.controller !== d || used.has(b.uid) || !at.attacking || !this.canBlockAttacker(b, at)) continue;
          used.add(b.uid); this.combat.blocks[b.uid] = at.uid; b.blocking = at.uid; at.blocked = true;
        }
        const desc = Object.keys(this.combat.blocks).map(bu => this.perm(+bu).def.name + ' bloqueia ' + this.perm(this.combat.blocks[bu]).def.name);
        this.log(desc.length ? this.players[d].name + ': ' + desc.join('; ') + '.' : this.players[d].name + ' não bloqueou.', d, { kind: 'block' });
        this.emit('change'); await this.pace('block');
        await this.priority('blockers');
        this.phase = 'dano'; this.emit('phase', { phase: 'dano' });
        const all = [...this.attackersOf(), ...Object.keys(this.combat.blocks).map(u => this.perm(+u)).filter(Boolean)];
        if (all.some(q => this.hasKw(q, 'iniciativa'))) await this.damageStep(true);
        await this.damageStep(false);
      }
      for (const q of this.battlefield) { q.attacking = false; q.blocking = null; q.blocked = false; }
      this.combat = null; this.emit('change');
    }

    orderBlockers(att, blockers) {
      return blockers.slice().sort((x, y) => M.AI.valuePerm(this, y) - M.AI.valuePerm(this, x));
    }

    async damageStep(first) {
      const a = this.active, d = this.opp(a);
      const dmg = []; // {src, perm?, player?, n}
      const fsStep = first;
      const deals = q => fsStep ? this.hasKw(q, 'iniciativa') : !this.hasKw(q, 'iniciativa') || !this.combat.fsDone;
      for (const at of this.attackersOf()) {
        if (!deals(at)) continue;
        let pw = this.power(at); if (pw <= 0) continue;
        const bl = this.blockersOf(at);
        if (!at.blocked) { dmg.push({ src: at, player: d, n: pw }); continue; }
        if (!bl.length) { if (this.hasKw(at, 'atropelar')) dmg.push({ src: at, player: d, n: pw }); continue; }
        const dt = this.hasKw(at, 'toque');
        const order = this.orderBlockers(at, bl);
        const assigned = new Map();
        for (const b of order) {
          const need = dt && !this.hasKw(b, 'casca') ? (b.damage > 0 && b.dt ? 0 : 1) : Math.max(0, this.toughness(b) - b.damage);
          if (need <= pw) { assigned.set(b, need); pw -= need; }
        }
        if (pw > 0) {
          if (this.hasKw(at, 'atropelar')) dmg.push({ src: at, player: d, n: pw });
          else { const b = order.find(x => !assigned.has(x)) || order[0]; assigned.set(b, (assigned.get(b) || 0) + pw); }
        }
        for (const [b, n] of assigned) if (n > 0) dmg.push({ src: at, perm: b, n });
      }
      for (const bu of Object.keys(this.combat.blocks)) {
        const b = this.perm(+bu); if (!b || !deals(b)) continue;
        const at = this.perm(this.combat.blocks[bu]); if (!at) continue;
        const pw = this.power(b); if (pw > 0) dmg.push({ src: b, perm: at, n: pw });
      }
      if (first) this.combat.fsDone = true;
      if (!dmg.length) return;
      await this.pace('strike', { dmg });
      const gains = [0, 0];
      for (const x of dmg) {
        if (x.player != null) { this.players[x.player].life -= x.n; this.stats.dmg[x.src.controller] += x.n; this.emit('life', { p: x.player, d: -x.n }); }
        else { x.perm.damage += x.n; if (this.hasKw(x.src, 'toque')) x.perm.dt = true; }
        if (this.hasKw(x.src, 'vinculo')) gains[x.src.controller] += x.n;
      }
      const toP = dmg.filter(x => x.player != null).reduce((s, x) => s + x.n, 0);
      if (toP) this.log(this.players[d].name + ' sofreu ' + toP + ' de dano de combate.', a, { kind: 'combatdmg' });
      for (let i = 0; i < 2; i++) if (gains[i]) { this.players[i].life += gains[i]; this.log(this.players[i].name + ' ganhou ' + gains[i] + ' de vida (vínculo com a vida).', i); this.emit('life', { p: i, d: gains[i] }); }
      this.emit('combatDamage', { dmg }); this.emit('change');
      await this.pace('damage');
      await this.checkSBA();
    }

    /* ---------- partida ---------- */
    async setup() {
      for (const pl of this.players) this.shuffle(pl.library);
      // Iniciante: as 7 primeiras cartas trazem 1 terreno básico de cada cor do deck
      if (this.opts.iniciante) for (const pl of this.players) {
        const cols = [...new Set(pl.library.filter(c => c.def.type === 'land').map(c => c.def.color))];
        const fixed = cols.map(col => pl.library.splice(pl.library.findIndex(c => c.def.type === 'land' && c.def.color === col), 1)[0]);

  /* ---------- truques de combate (após bloqueios) ---------- */

  }
  async function setArt(cardId, file) {

  }

  /* ============================================================
     PARTIDA
     ============================================================ */
  function newUI() {
    return { pending: null, mode: 'idle', target: null, attackSel: new Set(), blockMap: {}, blockSel: null, tab: 'chat', chat: [], log: [], seen: new Set(), thinking: false, autoEnd: false, flash: {}, lesson: null, lessonQueue: [], lastSay: '', status: '', adv: { kind: null, line: '', sub: '', hl: new Set(), key: 0 }, advBusy: false };
  }

  function startGame() {
    HUMAN = 0; OPP = 1;
    save();
    ui = newUI(); screen = 'game';
    const rng = Math.random;
    const ini = S.mode === 'iniciante', iniOpp = S.iniDeck === 'A' ? 'B' : 'A';
    let aiCols = ini ? M.INI_DECKS[iniOpp].cols.slice() : S.aiMode === 'pick' && S.ai.length ? S.ai.slice() : null;
    if (!aiCols) { const pool = M.COLORS.slice().sort(() => rng() - .5); aiCols = rng() < .5 ? [pool[0]] : [pool[0], pool[1]]; }
    ui.aiCols = aiCols;
    if (ini) { ui.ini = true; ui.level = 1; ui.myCols = M.INI_DECKS[S.iniDeck].cols.slice(); }
    const human = humanAgent();
    let opp;
    if (curLevel() === 3) {
      opp = M.makeClaudeAgent({
        tier: S.tier,
        onSay: t => say('Claude', t, 'claude'),
        onThinking: v => { ui.thinking = v; render(); },
        onStatus: s => {
          if (s === 'indisponivel' && !ui.claudeOff) { ui.claudeOff = true; say('Sistema', 'Não consegui consultar o Claude nesta visualização. O nível 3 continua com o motor Cavaleiro.', 'sys'); }
          if (s === 'limite') say('Sistema', 'Limite de consultas atingido por agora. Esta decisão foi tomada pelo motor Cavaleiro.', 'sys');
          if (s === 'falha') say('Sistema', 'Uma consulta falhou. Esta decisão foi tomada pelo motor Cavaleiro.', 'sys');
        },
      });
    } else opp = AI.makeAgent(curLevel(), { onSay: curLevel() === 1 ? (t, kind) => say('Instrutor', t, 'inst') : null });
    const seed = (Math.random() * 1e9) | 0;
    g = new M.Game({
      decks: ini ? [M.buildIniDeck(S.iniDeck), M.buildIniDeck(iniOpp)] : [M.buildDeck(S.my, M.mulberry32(seed)), M.buildDeck(aiCols, M.mulberry32(seed + 1))],
      agents: [human, opp], names: ['Você', oppName()], seed, iniciante: ini,
      onEvent, pace,
    });
    render(); window.scrollTo(0, 0);
    if ((S.mode === 'aprendiz' || ini) && M.Advisor) {
      ui.advisor = M.Advisor.create({ name: avName(myCols()) || 'Conselheira', tier: 'default', iniciante: ini, onBusy: b => { ui.advBusy = b; render(); } });
      advSay(ini ? 'Olá! Esta é uma partida para aprender. Vou ajudar você em duas coisas: escolher qual terreno baixar e decidir quando vale a pena trocar criaturas no combate.' : 'Olá! Vou acompanhar você nesta partida e dizer o que eu faria em cada decisão. Siga ou não: no fim, mostro o que aprendemos.');
      const gg = g;
      ui.advisor.briefing(g, HUMAN, myCols(), aiCols).then(t => { if (g === gg && t) advSay(t, 'Briefing'); });
    }
    if (curLevel() === 1) say('Instrutor', 'Olá! Vou jogar com ' + colorNames(aiCols).toLowerCase() + ' e explicar minhas jogadas. Você está com ' + colorNames(myCols()).toLowerCase() + '.', 'inst');
    if (curLevel() === 3) say('Claude', 'Boa partida! Estou com ' + colorNames(aiCols).toLowerCase() + '. Vou pensar a cada turno, então pode levar alguns segundos.', 'claude');
    g.run().catch(e => { console.error(e); toast('Erro no jogo: ' + (e && e.message)); });
  }

  /* ---------- eventos do motor ---------- */
  let rq = false;
  // enquanto o jogador digita, não redesenha (o campo perderia o foco e o teclado do celular fecharia)
  function render() { if (screen === 'game' && askFocused()) { ui.dirty = true; return; } if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; if (screen === 'game') renderGame(); }); }
  function onEvent(type, d) {
    if (type === 'log') { ui.log.push({ t: d.text, me: d.who === HUMAN }); if (ui.log.length > 400) ui.log.shift(); }
    if (type === 'turn') { ui.log.push({ t: 'Turno ' + d.turn + ' · ' + g.players[d.p].name, sep: true }); queueFx(() => turnBanner(d.p, d.turn)); }
    if (type === 'phase') {
      contStart('pill', '.midpill', [{ transform: 'scale(.72)', opacity: 0, filter: 'brightness(2.2)' }, { transform: 'scale(1.14)', opacity: 1, filter: 'brightness(1.5)', offset: .32 }, { transform: 'scale(1)', opacity: 1, filter: 'none' }], 820);
      contStart('line', '.midline', [{ transform: 'scaleX(0)', opacity: 1, filter: 'brightness(3)' }, { transform: 'scaleX(1)', opacity: 1, filter: 'brightness(1)' }], 700, '::before');
      contStart('vph', '.vphases li.on', [{ background: 'rgba(233,205,130,.38)' }, { background: 'rgba(233,205,130,0)' }], 900);
      if (d.phase === 'combate') contStart('cmb', '.ccol', [{ boxShadow: 'inset 0 0 0 1px rgba(224,97,79,0), inset 0 0 0 rgba(150,30,20,0)' }, { boxShadow: 'inset 0 0 0 1px rgba(224,97,79,.55), inset 0 0 150px rgba(150,30,20,.5)' }], 600);
    }
    if (type === 'life') {
      ui.flash[d.p] = d.d < 0 ? 'hit' : 'heal'; setTimeout(() => { ui.flash[d.p] = null; }, 700);
      if (!(d.d < 0 && recentStrike())) queueFx(() => { const a = visAvatar(d.p); floatAt(a, (d.d > 0 ? '+' : '−') + Math.abs(d.d), d.d > 0 ? 'heal' : 'dmg'); if (d.d < 0) shake(a, Math.abs(d.d) >= 4); });
    }
    if (type === 'hit') queueFx(() => { const el = elFor(d.uid); floatAt(el, '−' + d.n, 'dmg'); shake(el, d.n >= 3); });
    if (type === 'combatDamage' && !recentStrike()) queueFx(() => { for (const x of d.dmg) if (x.perm) { const el = elFor(x.perm.uid); floatAt(el, '−' + x.n, 'dmg'); shake(el, x.n >= 3); } });
    if (type === 'gameover') { setTimeout(showGameOver, 500); }
    if (type === 'phase' && S.mode === 'aprendiz') {
      if (g.active === HUMAN && d.phase === 'principal1') lesson('mana');
      if (g.active === HUMAN && d.phase === 'final') lesson('fases');
    }
    if (type === 'change' && isIni()) {
      for (const q of g.battlefield) for (const k of (q.def.type === 'creature' ? g.kws(q) : [])) {
        if (ui.seen.has('kw:' + k)) continue; ui.seen.add('kw:' + k);
        ui.chat.push({ from: 'Nova regra · ' + KWN[k], text: q.def.name + ' tem ' + KWN[k] + '. ' + KW_HELP[k], kind: 'lesson' });
      }
    }
    if (type === 'change' && S.mode === 'aprendiz') {
      if (g.battlefield.some(q => q.def.type === 'creature' && q.def.kw.length)) lesson('palavras');
      if (g.stack.length) lesson('pilha');
    }
    render();
  }
  async function pace(type, d) {
    if (replaying()) return;
    // pausa a partida enquanto o jogador conversa com a conselheira
    while (screen === 'game' && ui && ui.advisor && (ui.asking || askFocused())) await sleep(150);
    if (type === 'attack') queueFx(lunge);
    if (type === 'strike') { if (FX.on) await playStrike(d.dmg); return; }
    if (type === 'spell') { if (FX.on) await playSpell(d.item); return; }
    if (type === 'damage' && FX.on) { await dissolveDying(); await sleep(260); return; }
    if (type === 'resolve' && FX.on) await dissolveDying();
    if (type === 'turn') { await sleep(FX.on ? 1150 : 350); return; }
    if (type === 'phase') { await sleep({ desvirar: 420, manutencao: 300, compra: 420, principal1: 260, combate: 380, principal2: 220, final: 260 }[d.phase] || 220); return; }
    const aiActs = (d.p != null ? d.p : g.priorityPlayer) === OPP;
    const t = { land: 300, cast: 650, resolve: 420, attack: FX.on ? 420 : 650, block: FX.on ? 420 : 650, damage: 750 }[type] || 200;
    await sleep(aiActs || type === 'damage' || type === 'block' || type === 'attack' ? t : Math.min(t, 220));
  }
  function say(from, text, kind) {
    if (kind === 'inst' && ui.chat.slice(-8).some(m => m.text === text)) return;
    ui.chat.push({ from, text, kind });
    if (kind === 'inst' || kind === 'claude') ui.lastSay = text;
    render();
  }
  function lesson(key) {
    return;
    if (S.mode !== 'aprendiz' || ui.seen.has(key)) return;
    ui.seen.add(key);
    const n = LESSON_ORDER.indexOf(key) + 1;
    const [t, body] = LESSONS[key];
    ui.chat.push({ from: 'Lição ' + n + ' de 8 · ' + t, text: body, kind: 'lesson' });
    if (ui.lesson) ui.lessonQueue.push({ n, t, body }); else ui.lesson = { n, t, body };
    render();
  }
  function toast(t) {
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  /* ---------- agente humano ---------- */
  function shouldStop(p, win) {
    const top = g.stack[g.stack.length - 1];
    if (top && top.controller === p) return false;
    if (g.sorcerySpeed(p)) return !ui.autoEnd;
    if (!g.hasResponse(p)) return false;
    if (top) return true;
    if (g.active === p) return win === 'blockers';
    return win === 'attackers' || win === 'blockers' || win === 'end';
  }
  function waitPending(obj) { return new Promise(res => { ui.pending = Object.assign(obj, { resolve: res }); render(); }); }
  function finish(v) { const p = ui.pending; ui.pending = null; ui.mode = 'idle'; ui.target = null; closeModal(); if (p) p.resolve(v); render(); }

  function humanAgent() {
    return {
      kind: 'human',
      async chooseMulligan(g, p, mulls) {
        const tip = ui.advisor ? ui.advisor.mulligan(g, p, mulls) : '';
        if (tip) advSay(tip, 'Mão inicial');
        return modalChoice({
          title: mulls ? 'Nova mão (mulligan ' + mulls + ')' : 'Sua mão inicial',
          text: (tip ? ui.advisor.name + ': ' + tip + ' ' : '') + 'Uma boa mão costuma ter de 2 a 5 terrenos. Se trocar (mulligan), você embaralha, compra 7 de novo e depois devolve ' + (mulls + 1) + ' carta(s) ao fundo do grimório.',
          cards: g.players[p].hand,
          buttons: mulls >= 2 ? [{ v: true, label: 'Manter', primary: true }] : [{ v: false, label: 'Trocar (mulligan)' }, { v: true, label: 'Manter', primary: true }],
        });
      },
      async chooseBottom(g, p, n) { return modalSelect({ title: 'Devolva ' + n + ' carta(s) ao fundo', text: 'Escolha o que mandar para o fundo do grimório.', cards: g.players[p].hand, n }); },
      async priority(g, p, win) {
        if (!shouldStop(p, win)) return { type: 'pass' };
        advBegin(g.sorcerySpeed(p) ? 'main' : 'resp', { win });
        const v = await waitPending({ type: 'priority', win });
        advResolve(v); return v;
      },
      async chooseAttackers(g, p) {
        if (ui.autoEnd) return [];
        ui.attackSel = new Set(); ui.mode = 'attack';
        advBegin('attack');
        const v = await waitPending({ type: 'attack' });
        advResolve(v); return v;
      },
      async chooseBlocks(g, p) {
        const atks = g.attackersOf(); const mine = g.creatures(p).filter(q => !q.tapped);
        if (!mine.some(b => atks.some(a => g.canBlockAttacker(b, a)))) { await sleep(500); return {}; }
        ui.blockMap = {}; ui.blockSel = null; ui.mode = 'block';
        advBegin('block');
        const v = await waitPending({ type: 'block' });
        advResolve(v); return v;
      },
      async chooseTarget(g, p, item, legal) {
        return pickTarget({ title: 'Escolha o alvo de ' + item.name + ' (' + effText(item.eff) + ')', legal, skip: true });
      },
      async chooseScry(g, p, cards) { return modalScry(cards); },
      async chooseDiscard(g, p, n, why) { return modalSelect({ title: 'Descarte ' + n + ' carta(s)', text: why === 'limpeza' ? 'Sua mão passou de 7 cartas no fim do turno.' : 'Um efeito do oponente obriga você a descartar.', cards: g.players[p].hand, n }); },
      async choosePay(g, p, n, s) {
        return modalChoice({ title: 'Pagar ' + n + ' para manter ' + s.name + '?', text: 'O oponente usou Interromper. Se você pagar ' + n + ' de mana agora, sua mágica continua na pilha.', cards: [], buttons: [{ v: false, label: 'Não pagar' }, { v: true, label: 'Pagar ' + n, primary: true }] });
      },
      async choosePick(g, p, cards) {
        const r = await modalSelect({ title: 'Escolha a carta que o oponente vai descartar', text: 'A mão do oponente foi revelada. Só aparecem cartas que não são terrenos.', cards, n: 1 });
        return r[0];
      },
    };
  }
  function effText(e) {
    if (!e) return '';
    if (e.k === 'seq') return e.list.map(effText).filter(Boolean).join(' e ');
    return ({ dmg: e.n + ' de dano', bounce: 'devolver à mão', exile: 'exilar', raiseDead: 'voltar para a mão', reanimate: 'reanimar', pump: '+' + e.p + '/+' + e.t })[e.k] || '';
  }

  /* alvo: retorna promessa resolvida com o alvo ou null */
  function pickTarget({ title, legal, skip, cancel }) {
    const gy = legal.filter(t => t.t === 'gy');
    if (gy.length && gy.length === legal.length) {
      const cards = gy.map(t => g.players[t.owner].gy.find(c => c.uid === t.uid)).filter(Boolean);
      return modalSelect({ title, text: 'Escolha uma criatura do cemitério.', cards, n: 1, allowCancel: true }).then(r => r && r.length ? gy.find(t => t.uid === r[0]) : null);
    }
    return new Promise(res => {
      ui.mode = 'target';
      ui.target = { title, legal, skip, cancel, resolve: v => { ui.mode = ui.prevMode || 'idle'; ui.target = null; res(v); render(); } };
      render();
    });
  }
  function isLegalTarget(t) { return ui.target && ui.target.legal.some(x => g.sameTarget(x, t)); }

  /* ---------- jogar uma carta / ativar ---------- */
  async function tryPlay(uid) {
    if (!ui.pending || ui.pending.type !== 'priority') return;
    const c = g.players[HUMAN].hand.find(x => x.uid === uid);
    if (!c) return;
    closeModal();
    if (c.def.type === 'land') { if (g.canPlayLand(HUMAN, c)) finish({ type: 'land', uid }); return; }
    if (!g.canCast(HUMAN, c)) return;
    const eff = c.def.spell;
    if (eff && eff.tgt) {
      const legal = g.legalTargets(HUMAN, eff.tgt, c);
      ui.prevMode = 'idle';
      const t = await pickTarget({ title: 'Escolha o alvo de ' + c.def.name, legal, cancel: true });
      if (!t) return;
      if (ui.pending && ui.pending.type === 'priority') finish({ type: 'cast', uid, target: t });
      return;
    }
    finish({ type: 'cast', uid });
  }
  async function tryActivate(uid) {
    if (!ui.pending || ui.pending.type !== 'priority') return;
    const q = g.perm(uid); if (!q || !g.canActivate(HUMAN, q)) return;
    closeModal();
    const legal = g.legalTargets(HUMAN, q.def.act.eff.tgt, q);
    ui.prevMode = 'idle';
    const t = await pickTarget({ title: 'Escolha o alvo de ' + q.def.name + ' (1 de dano)', legal, cancel: true });
    if (!t) return;
    if (ui.pending && ui.pending.type === 'priority') finish({ type: 'act', uid, target: t });
  }
  /* Iniciante: explica se falta quantidade de mana ou uma cor específica */
  function missingColors(p, d) {
    const src = g.manaSources(p); if (src.length < d.cmc) return null;
    const have = {}; for (const s of src) for (const c of s.colors) have[c] = (have[c] || 0) + 1;
    return M.COLORS.filter(c => (d.cost.c[c] || 0) > (have[c] || 0));
  }
  function manaWhy(p, d) {
    const free = g.manaSources(p).length;
    if (free < d.cmc) return 'Mana insuficiente: esta carta custa ' + d.cmc + ' e você tem ' + free + ' mana livre.';
    const miss = missingColors(p, d);
    if (miss && miss.length) return 'Falta mana ' + miss.map(c => M.COLOR_INFO[c].nome.toLowerCase()).join(' e ') + ': você tem ' + free + ' mana livre, mas esta carta pede essa cor. Baixe um terreno dessa cor quando puder.';
    return '';
  }
  function whyNot(c) {
    const d = c.def, p = HUMAN;
    if (!ui.pending || ui.pending.type !== 'priority') return 'Aguarde: agora não é sua vez de agir.';
    if (d.type === 'land') {
      if (g.players[p].landPlayed) return 'Você já jogou um terreno neste turno.';
      if (!g.sorcerySpeed(p)) return 'Terrenos só na sua fase principal, com a pilha vazia.';

  /* ============================================================
     PvP (site separado) — lobby, sala e partida sincronizada
     Os dois navegadores rodam o mesmo motor com a mesma semente.
     Pelo Firebase passam só as decisões de cada jogador, numeradas
     em ordem ("jogadas"). Quem reconecta relê as jogadas e continua.
     ============================================================ */
  const P = { uid: null, code: null, seat: null, meta: {}, pres: {}, host: null, guest: null, game: 0, offs: [], stream: null, online: false, deck: [], nick: '' };
  try { P.nick = localStorage.getItem('pvp-nick') || ''; P.deck = JSON.parse(localStorage.getItem('pvp-deck') || '["R"]'); } catch (e) { P.deck = ['R']; }
  let NET = null;
  const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';

  function realNet() {
    firebase.initializeApp(window.PVP_FIREBASE);
    const db = firebase.database();
    const R = (code, path) => db.ref('rooms/' + code + (path ? '/' + path : ''));
    return {
      async init() { const c = await firebase.auth().signInAnonymously(); return c.user.uid; },
      onConnected(cb) { db.ref('.info/connected').on('value', s => cb(!!s.val())); },
      async create(code, uid) { await R(code, 'host').set(uid); await R(code, 'meta').set({ created: firebase.database.ServerValue.TIMESTAMP, state: 'lobby', game: 0 }); },
      async seats(code) { const [h, g2] = await Promise.all([R(code, 'host').get(), R(code, 'guest').get()]); return { host: h.val(), guest: g2.val() }; },
      join(code, uid) { return R(code, 'guest').set(uid); },
      watch(code, key, cb) { const ref = R(code, key); const f = s => cb(s.val()); ref.on('value', f); return () => ref.off('value', f); },
      set(code, path, val) { return R(code, path).set(val); },
      update(code, path, obj) { return R(code, path).update(obj); },
      async loadMoves(code, game) { const s = await R(code, 'moves').orderByKey().startAt(game + '_').endAt(game + '_~').get(); const out = []; s.forEach(c => { out.push([c.key, c.val()]); }); return out; },
      moves(code, game, cb) { const q = R(code, 'moves').orderByKey().startAt(game + '_').endAt(game + '_~'); const f = s => cb(s.key, s.val()); q.on('child_added', f); return () => q.off('child_added', f); },
      push(code, key, val) { return R(code, 'moves/' + key).set(val); },
      presence(code, uid) {
        const r = R(code, 'presence/' + uid), c = db.ref('.info/connected');
        const f = s => { if (s.val()) { r.onDisconnect().remove(); r.set(true); } };
        c.on('value', f);
        return () => { c.off('value', f); r.remove(); };
      },
    };
  }

  /* ---------- fluxo de jogadas ---------- */
  const pad = (n, k) => String(n).padStart(k, '0');
  async function makeStream(code, game) {
    const st = { code, game, moves: [], next: 0, waiters: {}, replayEnd: 0, off: () => { } };
    const add = (k, v) => { const i = +String(k).split('_')[1]; if (!(i >= 0) || st.moves[i] !== undefined) return; st.moves[i] = v; const w = st.waiters[i]; if (w) { delete st.waiters[i]; w(v); } };
    for (const [k, v] of await NET.loadMoves(code, game)) add(k, v);
    st.replayEnd = st.moves.length;
    st.off = NET.moves(code, game, add);
    st.get = i => st.moves[i] !== undefined ? Promise.resolve(st.moves[i]) : new Promise(r => { st.waiters[i] = r; });
    st.put = async (i, v) => {
      for (let tries = 0; ; tries++) {
        try { await NET.push(code, game + '_' + pad(i, 5), v); st.moves[i] = st.moves[i] || v; return; }
        catch (e) { if (st.moves[i] !== undefined) return; if (tries >= 6) { toast('Sem conexão: tentando enviar sua jogada…'); } await sleep(Math.min(4000, 400 * (tries + 1))); }
      }
    };
    return st;
  }
  const replaying = () => !!(ui && ui.pvp && ui.pvp.stream && ui.pvp.stream.next < ui.pvp.stream.replayEnd);

  // assinatura do estado: as duas telas precisam bater a cada decisão
  function stHash(gg) {
    let s = gg.turn + '|' + gg.phase + '|' + gg.stack.length;
    for (const pl of gg.players) s += '|' + pl.life + ',' + pl.library.length + ',' + pl.hand.length + ',' + pl.gy.length;
    for (const q of gg.battlefield) s += '|' + q.uid + (q.tapped ? 't' : '') + (q.damage || '') + (q.counters || '');
    let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  function desync(i, m, mv) {

  }

  // decisão de prioridade que as duas telas conseguem prever sozinhas (não precisa ir pela rede)
  function autoPass(gg, p, win) {
    const top = gg.stack[gg.stack.length - 1];
    if (top && top.controller === p) return true;
    if (gg.sorcerySpeed(p)) return false;
    if (!gg.hasResponse(p)) return true;
    if (top) return false;
    if (gg.active === p) return win !== 'blockers';
    return !(win === 'attackers' || win === 'blockers' || win === 'end');
  }
  const METHODS = ['chooseMulligan', 'chooseBottom', 'priority', 'chooseAttackers', 'chooseBlocks', 'chooseTarget', 'chooseScry', 'chooseDiscard', 'choosePay', 'choosePick'];
  function netAgents(st, seat) {
    const human = humanAgent();
    const mk = s => {
      const a = { kind: s === seat ? 'human' : 'remote' };
      for (const m of METHODS) a[m] = async (gg, ...rest) => {
        if (m === 'priority' && autoPass(gg, s, rest[1])) return { type: 'pass' };
        if (m === 'chooseBlocks') { const atks = gg.attackersOf(); if (!gg.creatures(s).some(b => !b.tapped && atks.some(x => gg.canBlockAttacker(b, x)))) return {}; }
        const i = st.next++, h = stHash(gg);
        let mv = st.moves[i];
        if (mv === undefined && s === seat) {
          const v = await human[m](gg, ...rest);
          mv = { by: P.uid, k: m, s, v: JSON.stringify(v === undefined ? null : v), h };
          await st.put(i, mv);
        } else if (mv === undefined) {
          ui.waitRemote = true; render();
          mv = await st.get(i);
          ui.waitRemote = false; render();
        }
        if (mv.k !== m || mv.s !== s || (mv.h && mv.h !== h)) desync(i, m, mv);
        return JSON.parse(mv.v);
      };
      return a;
    };
    return [mk(0), mk(1)];
  }

  /* ---------- partida PvP ---------- */
  async function startPvp(meta) {
    closeModal();

    const decks = [[].concat(meta.decks[0]), [].concat(meta.decks[1])];

    HUMAN = seat; OPP = other;

    g.run().catch(e => { console.error(e); toast('Erro no jogo: ' + (e && e.message)); })

  }
  function remoteConcede(by) {

    g.opts.pace = () => new Promise(() => { }); g.opts.onEvent = null;
    ui.pending = null; ui.mode = 'idle'; ui.drawer = null; closeModal();
    render(); setTimeout(showGameOver, 250);
  }
  const oppUid = () => P.seat === 0 ? P.guest : P.host;
  const oppOnline = () => !!(oppUid() && P.pres && P.pres[oppUid()]);

  /* ---------- lobby ---------- */
  function lobbyHead(sub) {
    return '<header class="brand"><h1>Grimório dos Reinos</h1><p>' + sub + '</p></header>'
      + '<div class="pvconn"><span class="dot ' + (P.online && P.uid ? 'on' : 'bad') + '"></span>' + (P.uid ? (P.online ? 'Conectado' : 'Sem conexão com o servidor') : 'Conectando…') + '</div>';
  }
  function renderLobby(err) {
    screen = 'lobby';
    root.innerHTML = '<div class="start pvlobby">' + lobbyHead('Duelo entre amigos. Crie uma sala e mande o convite, ou entre com o código que recebeu.')
      + (err ? '<p class="pverr">' + esc(err) + '</p>' : '')
      + '<div class="setup">'
      + '<section class="box"><h2>SEU NOME</h2><input class="pvin" id="pvnick" maxlength="18" placeholder="Como seu amigo vai te ver" value="' + esc(P.nick) + '"></section>'
      + '<section class="box"><h2>CRIAR UMA SALA</h2><p class="hint">Você recebe um código e um link para mandar.</p><button class="btn primary" data-act="pvcreate"' + (P.uid ? '' : ' disabled') + '>Criar sala</button></section>'
      + '<section class="box"><h2>ENTRAR COM CÓDIGO</h2><div class="row"><input class="pvin code" id="pvcode" maxlength="4" placeholder="ABCD" autocomplete="off"><button class="btn" data-act="pvjoin"' + (P.uid ? '' : ' disabled') + '>Entrar</button></div></section>'
      + '<section class="box"><h2>TREINAR SOZINHO</h2><p class="hint">Jogue contra o computador (Instrutor ou Cavaleiro).</p><button class="btn" data-act="pvsolo">Jogar contra o computador</button></section>'
      + '</div><div class="startfoot"><span></span><div class="row"><button class="btn ghost" data-act="rules">Como jogar</button></div></div></div>';
  }
  function deckChips(sel) { return M.COLORS.map(c => '<button class="cchip" data-act="pvdeck" data-v="' + c + '" aria-pressed="' + sel.includes(c) + '">' + pip(c).replace('class="pip', 'class="pip big') + '<span>' + M.COLOR_INFO[c].nome + '</span></button>').join(''); }
  function seatCard(seat) {
    const m = P.meta || {}, uid = seat === 0 ? P.host : P.guest;
    const deck = m.decks && m.decks[seat] ? [].concat(m.decks[seat]) : null;
    const ready = !!(m.ready && m.ready[seat]);
    const on = uid && P.pres && P.pres[uid];
    const nm = (m.names && m.names[seat]) || (seat === 0 ? 'Anfitrião' : 'Convidado');
    const av = deck ? ART['AV_' + avKey(deck)] : null;
    return '<div class="pvseat' + (seat === P.seat ? ' me' : '') + '">'
      + (av ? '<img src="art/' + av + '" alt="">' : '<span class="pvph"></span>')
      + '<div><b>' + esc(nm) + (seat === P.seat ? ' (você)' : '') + '</b>'
      + '<span class="st"><span class="dot ' + (on ? 'on' : '') + '"></span>' + (!uid ? 'aguardando…' : on ? 'online' : 'offline') + '</span>'
      + '<span class="dk">' + (deck ? esc(avName(deck)) + ' · ' + colorNames(deck) : 'escolhendo o deck…') + '</span>'
      + (ready ? '<span class="rd">Pronto ✓</span>' : '') + '</div></div>';
  }
  function renderRoom() {
    screen = 'lobby';
    const m = P.meta || {}, host = P.seat === 0;
    const meReady = !!(m.ready && m.ready[P.seat]);
    const both = !!(P.host && P.guest);
    const status = m.state === 'playing' ? 'Partida em andamento…' : !both ? (host ? 'Mande o convite e espere seu amigo entrar.' : 'Conectando à sala…') : meReady ? 'Esperando o amigo ficar pronto…' : 'Escolha seu deck e toque em "Estou pronto".';
    const blurb = P.deck.map(c => COLOR_BLURB[c]).join('<br>') || 'Escolha 1 ou 2 cores.';
    root.innerHTML = '<div class="start pvlobby">' + lobbyHead('Sala de duelo')
      + '<div class="setup">'
      + '<section class="box pvroom"><h2>SALA</h2><div class="pvcode">' + esc(P.code) + '</div>'
      + (host ? '<div class="row" style="justify-content:center"><button class="btn primary" data-act="pvcopy">Copiar link do convite</button>' + (navigator.share ? '<button class="btn" data-act="pvshare">Compartilhar…</button>' : '') + '</div>' : '')
      + '<div class="pvseats">' + seatCard(0) + seatCard(1) + '</div></section>'
      + '<section class="box"><h2>SEU DECK</h2><p class="hint">1 ou 2 cores. ' + (P.deck.length ? 'Planeswalker: <b>' + esc(avName(P.deck)) + '</b>' : '') + '</p><div class="colors">' + deckChips(P.deck) + '</div><div class="cdesc">' + blurb + '</div></section>'
      + '</div><div class="startfoot"><span class="pvstatus">' + status + '</span><div class="row"><button class="btn ghost" data-act="pvleave">Sair da sala</button>'
      + '<button class="btn ' + (meReady ? '' : 'primary') + '" data-act="pvready"' + (P.deck.length && both ? '' : ' disabled') + '>' + (meReady ? 'Cancelar pronto' : 'Estou pronto') + '</button></div></div></div>';
  }
  const inviteURL = () => location.origin + location.pathname + '?sala=' + P.code;

  async function pvEnter(code, seat) {
    pvDetach();
    P.code = code; P.seat = seat; P.meta = {}; P.pres = {}; P.host = null; P.guest = null; P.game = 0;
    try { sessionStorage.setItem('pvp-room', code + ':' + seat); } catch (e) { }
    if (location.search) history.replaceState(null, '', location.pathname);
    P.offs.push(NET.presence(code, P.uid));
    P.offs.push(NET.watch(code, 'host', v => { P.host = v; pvRefresh(); }));
    P.offs.push(NET.watch(code, 'guest', v => { P.guest = v; pvRefresh(); }));
    P.offs.push(NET.watch(code, 'presence', v => { P.pres = v || {}; pvRefresh(); }));
    P.offs.push(NET.watch(code, 'meta', v => { P.meta = v || {}; onMeta(); }));
    const w = {}; if (P.nick) w['names/' + seat] = P.nick; if (P.deck.length) w['decks/' + seat] = P.deck;
    if (Object.keys(w).length) NET.update(code, 'meta', w).catch(() => { });
    renderRoom();
  }
  function pvDetach() { P.offs.forEach(f => { try { f(); } catch (e) { } }); P.offs = []; }
  function pvRefresh() { if (screen === 'lobby' && P.code) renderRoom(); else if (screen === 'game') render(); }
  function onMeta() {
    const m = P.meta;
    if (m.state === 'playing' && m.game && m.game !== P.game && m.decks && m.decks[0] && m.decks[1]) { P.game = m.game; startPvp(m); return; }
    if (m.concede && m.concede.game === P.game && g && ui && ui.pvp) remoteConcede(m.concede.seat);
    if (P.seat === 0 && m.state !== 'playing' && m.ready && m.ready[0] && m.ready[1] && m.decks && m.decks[0] && m.decks[1] && !P.starting) {
      P.starting = true;
      NET.update(P.code, 'meta', { state: 'playing', game: (m.game || 0) + 1, seed: (Math.random() * 1e9) | 0, ready: null, concede: null })
        .catch(() => toast('Não consegui iniciar a partida.')).then(() => { P.starting = false; });
    }
    pvRefresh();
  }
  async function pvCreate() {
    for (let i = 0; i < 6; i++) {
      const c = Array.from({ length: 4 }, () => LETTERS[Math.floor(Math.random() * LETTERS.length)]).join('');
      try { await NET.create(c, P.uid); return pvEnter(c, 0); } catch (e) { }
    }
    renderLobby('Não consegui criar a sala. Tente de novo.');
  }
  async function pvJoin(c) {
    c = String(c || '').trim().toUpperCase();
    if (!/^[A-Z]{4}$/.test(c)) { renderLobby('O código tem 4 letras.'); return; }
    let s; try { s = await NET.seats(c); } catch (e) { renderLobby('Não consegui ler a sala ' + c + '.'); return; }
    if (!s.host) { renderLobby('Sala ' + c + ' não encontrada.'); return; }
    if (s.host === P.uid) return pvEnter(c, 0);
    if (s.guest === P.uid) return pvEnter(c, 1);
    if (s.guest) { renderLobby('A sala ' + c + ' já tem dois jogadores.'); return; }
    try { await NET.join(c, P.uid); pvEnter(c, 1); } catch (e) { renderLobby('Não consegui entrar na sala ' + c + '.'); }
  }
  function pvLeave() {
    pvDetach();
    if (g) abandon();
    P.code = null; P.seat = null; P.game = 0;
    try { sessionStorage.removeItem('pvp-room'); } catch (e) { }
    renderLobby();
  }
  function saveLocal() { try { localStorage.setItem('pvp-nick', P.nick); localStorage.setItem('pvp-deck', JSON.stringify(P.deck)); } catch (e) { } }

  document.addEventListener('input', e => { if (e.target.id === 'pvnick') { P.nick = e.target.value.trim().slice(0, 18); saveLocal(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pvcode') pvJoin(e.target.value); });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const act = t.dataset.act; if (!act.startsWith('pv')) return;
    if (act === 'pvreload') { location.reload(); return; }
    if (act === 'pvcreate') { t.disabled = true; pvCreate(); return; }
    if (act === 'pvjoin') { const i = document.getElementById('pvcode'); pvJoin(i && i.value); return; }
    if (act === 'pvsolo') { HUMAN = 0; OPP = 1; renderStart(); return; }
    if (act === 'pvback') { renderLobby(); return; }
    if (act === 'pvleave') { pvLeave(); return; }
    if (act === 'pvcopy') {
      const u = inviteURL();
      (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).catch(() => { const x = document.createElement('textarea'); x.value = u; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); } catch (e2) { } x.remove(); })
        .finally(() => toast('Link copiado! Cole no WhatsApp ou onde preferir.'));
      return;
    }
    if (act === 'pvshare') { navigator.share({ title: 'Grimório dos Reinos', text: 'Bora um duelo no Grimório dos Reinos? Entre na minha sala:', url: inviteURL() }).catch(() => { }); return; }
    if (act === 'pvdeck') {
      if ((P.meta.ready || {})[P.seat]) NET.set(P.code, 'meta/ready/' + P.seat, false).catch(() => { });
      const v = t.dataset.v, i = P.deck.indexOf(v);
      if (i >= 0) P.deck.splice(i, 1); else { if (P.deck.length >= 2) P.deck.shift(); P.deck.push(v); }
      P.deck = M.COLORS.filter(c => P.deck.includes(c)); saveLocal();
      if (P.code && P.deck.length) NET.set(P.code, 'meta/decks/' + P.seat, P.deck).catch(() => { });
      renderRoom(); return;
    }
    if (act === 'pvready') {
      const r = !((P.meta.ready || {})[P.seat]);
      const w = { ['ready/' + P.seat]: r, ['decks/' + P.seat]: P.deck }; if (P.nick) w['names/' + P.seat] = P.nick;
      NET.update(P.code, 'meta', w).catch(() => toast('Não consegui avisar o amigo. Verifique a conexão.'));
      return;
    }
  }, true);

  window.__pvdbg = () => ({ seat: P.seat, game: P.game, meta: P.meta && { state: P.meta.state, game: P.meta.game }, screen, st: P.stream && { next: P.stream.next, end: P.stream.replayEnd, len: P.stream.moves.length, waiting: Object.keys(P.stream.waiters) }, pend: ui && ui.pending && ui.pending.type, mode: ui && ui.mode, wait: ui && ui.waitRemote, turn: g && g.turn, phase: g && g.phase });
  async function pvpBoot() {
    if (S.mode !== 'iniciante') S.mode = 'partida'; if (S.level > 2) S.level = 2;
    try { NET = window.NET_MOCK || realNet(); } catch (e) { root.innerHTML = '<div class="start"><p class="pverr">Não consegui carregar o servidor do jogo.</p></div>'; return; }
    NET.onConnected(on => { P.online = on; if (screen === 'lobby' && !P.code) renderLobby(); else pvRefresh(); });
    renderLobby();
    try { P.uid = await NET.init(); } catch (e) { renderLobby('Falha no login do jogo (' + (e && e.code || 'erro') + ').'); return; }
    const inv = (new URLSearchParams(location.search).get('sala') || '').toUpperCase();
    let last = null; try { last = sessionStorage.getItem('pvp-room'); } catch (e) { }
    if (last && (!inv || last.startsWith(inv + ':'))) { const [c, s] = last.split(':'); pvEnter(c, +s); }
    else if (/^[A-Z]{4}$/.test(inv)) pvJoin(inv);
    else renderLobby();
  }
  function pvRematch() {
    screen = 'lobby'; renderRoom();
    NET.update(P.code, 'meta', { ['ready/' + P.seat]: true, ['decks/' + P.seat]: P.deck }).catch(() => { });
  }

  pvpBoot();
})();

</script>
</body>
</html>
