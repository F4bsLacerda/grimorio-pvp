<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grimório dos Reinos · Duelo</title>
<meta name="description" content="Duelo de cartas medieval entre amigos.">
<link rel="icon" href="art/AV_U.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@400;700&family=Alegreya+Sans:wght@400;600;700;800&family=Alegreya:ital,wght@0,400;0,700;1,400&family=Grenze+Gotisch:wght@500&family=Cinzel:wght@700;900&display=swap">
<style>
html, body { margin: 0; min-height: 100%; background: #121419; }
/* Layout: mesa de pedra à luz de vela — adversário no alto, você embaixo,
   faixa central com fases e pilha; painel lateral de conversa e registro. */
:root {
  color-scheme: dark;
  --bg: #121419;
  --table: #191c23;
  --table-2: #1f232c;
  --panel: #1c2028;
  --line: #2f3542;
  --line-2: #3d4554;
  --ink: #ebe3d1;
  --muted: #9d9686;
  --gold: #c9a14a;
  --gold-hi: #e9cd82;
  --danger: #e0614f;
  --ok: #7fbf7a;
  --parch: #efe6cf;
  --parch-2: #e2d6b8;
  --card-ink: #2a2219;
  --pip-ink: #1b1712;
  /* tinturas heráldicas */
  --tW: #ddd5bf; --tU: #2f5fa8; --tB: #3b3442; --tR: #b13a2f; --tG: #2e7849; --tL: #8a7a5c; --tM: #a8893f;
  --pW: #f3ecd2; --pU: #4f86d6; --pB: #8a7f95; --pR: #e0614f; --pG: #5aa66f;
  --f-display: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
  --f-name: "Alegreya SC", "Alegreya", Georgia, serif;
  --f-body: "Alegreya", Georgia, "Times New Roman", serif;
  --f-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --card-w: 92px;
  --hand-w: 124px;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  background-image: radial-gradient(1200px 600px at 50% 40%, #1d2129 0%, var(--bg) 70%);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
@media (min-width: 420px) { body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- botões ---------- */
.btn { font-family: var(--f-ui); font-weight: 600; font-size: 14px; border: 1px solid var(--line-2); background: var(--table-2); color: var(--ink); padding: 9px 16px; border-radius: 6px; cursor: pointer; letter-spacing: .01em; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: linear-gradient(#d3ad57, #b18a36); color: #1c160c; border-color: #e6c675; }
.btn.primary:hover { background: linear-gradient(#e0bb63, #bf963e); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- tela inicial ---------- */
.start { max-width: 980px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 26px; }
.brand { display: grid; gap: 6px; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 9vw, 84px); line-height: .9; margin: 0; color: var(--gold-hi); letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 16px; }
.setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.box h2 { margin: 0; font-family: var(--f-name); font-weight: 700; font-size: 15px; letter-spacing: .08em; color: var(--gold); }
.inibox { grid-column: span 2; }
@media (max-width: 640px) { .inibox { grid-column: auto; } }
.opt.inideck { display: flex; gap: 12px; align-items: center; }
.iniav { width: 64px; height: 64px; flex: none; border-radius: 50%; object-fit: cover; border: 1px solid var(--line-2); display: inline-flex; align-items: center; justify-content: center; gap: 2px; background: var(--table-2); }
.initx { display: grid; gap: 2px; min-width: 0; }
.initx em { color: var(--gold-hi); font-style: normal; }
.box .hint { color: var(--muted); font-size: 13.5px; margin: 0; }
.seg { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line-2); background: var(--table); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.opt b { font-family: var(--f-name); font-size: 16px; font-weight: 700; }
.opt span { color: var(--muted); font-size: 13.5px; }
.opt[aria-pressed="true"] { border-color: var(--gold); background: #2a2618; box-shadow: inset 0 0 0 1px var(--gold); }
.colors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cchip { border: 1px solid var(--line-2); border-radius: 8px; background: var(--table); padding: 10px 4px 8px; cursor: pointer; display: grid; justify-items: center; gap: 4px; font-family: var(--f-ui); font-size: 12.5px; }
.cchip .pip { width: 30px; height: 30px; }
.cchip[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); background: #2a2618; }
.cdesc { font-size: 13.5px; color: var(--muted); min-height: 3.2em; }
.cdesc b { color: var(--ink); font-weight: 700; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.startfoot { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.balance { font-family: var(--f-ui); font-size: 13px; color: var(--muted); }

/* ---------- pips de mana ---------- */
.pip { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
.pip svg { width: 74%; height: 74%; fill: var(--pip-ink); }
.pip.W { background: var(--pW); } .pip.U { background: var(--pU); } .pip.B { background: var(--pB); } .pip.R { background: var(--pR); } .pip.G { background: var(--pG); }
.pip.N { background: #cfc6b0; color: var(--pip-ink); font: 700 11px/1 var(--f-ui); }
.cost { display: inline-flex; gap: 2px; align-items: center; }

/* ---------- aplicativo ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; height: 100%; padding-block: 10px; }
.board { display: grid; grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 1fr) auto auto; gap: 8px; min-width: 0; min-height: 0; }
.dock { display: grid; gap: 4px; min-width: 0; }
.actbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 10px; background: var(--table); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .name { font-family: var(--f-name); font-weight: 700; font-size: 16px; white-space: nowrap; }
.who .sub { font-family: var(--f-ui); font-size: 12px; color: var(--muted); }
.life { font-family: var(--f-ui); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 26px; min-width: 52px; text-align: center; padding: 0 8px; border-radius: 8px; background: #2a1f1c; border: 1px solid #5a3a33; color: #f4d9cf; cursor: default; }
.life.target { cursor: pointer; }
.life.hit { animation: hit .6s; } .life.heal { animation: heal .6s; }
@keyframes hit { 30% { background: var(--danger); color: #fff; } }
@keyframes heal { 30% { background: var(--ok); color: #10200f; } }
.zones { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.zbtn { font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); background: var(--table-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zbtn b { color: var(--ink); }
.zbtn.warn b { color: var(--danger); }
.ohand { display: flex; gap: 3px; }
.cback { width: 14px; height: 20px; border-radius: 2px; background: linear-gradient(135deg, #3a2f52, #241d33); border: 1px solid #5b4a7a; }
.thinking { font-family: var(--f-ui); font-size: 12.5px; color: var(--gold-hi); display: inline-flex; gap: 6px; align-items: center; }
.thinking::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold-hi); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .2; } }

.field { background: var(--table-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px 8px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; position: relative; }
.field.opp { background-image: linear-gradient(180deg, rgba(255,255,255,.015), transparent); }
.lane { flex: none; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; min-height: 24px; }
.lane.lands { gap: 5px; }
.lane .empty { font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); opacity: .7; padding: 4px; }

/* faixa central */
.center { display: grid; gap: 6px; align-items: center; padding: 2px 4px; }
.phases { display: flex; gap: 2px; flex-wrap: wrap; font-family: var(--f-ui); font-size: 12px; }
.ph { padding: 4px 8px; border-radius: 4px; color: var(--muted); background: transparent; border: 1px solid transparent; cursor: help; white-space: nowrap; }
.ph.on { color: #1c160c; background: var(--gold); font-weight: 700; }
.ph.turnOpp.on { background: #8a7fb0; color: #120f1c; }
.actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.status { font-family: var(--f-ui); font-size: 13px; color: var(--muted); grid-column: 1 / -1; min-height: 1.3em; }
.status b { color: var(--gold-hi); font-weight: 700; }

.stack { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 0; }
.stack:empty { display: none; }
.stackitem { display: flex; gap: 6px; align-items: center; padding: 4px 8px 4px 4px; border-radius: 6px; background: #241f2f; border: 1px solid #5b4a7a; font-family: var(--f-ui); font-size: 12.5px; cursor: pointer; max-width: 100%; }
.stackitem.top { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.stackitem .who { font-size: 11px; color: var(--muted); }
.stackitem.target { outline: 2px dashed var(--gold-hi); outline-offset: 2px; }
.stacklabel { font-family: var(--f-name); font-size: 12.5px; letter-spacing: .08em; color: var(--muted); }

/* mão */
.hand { display: flex; gap: 8px; overflow-x: auto; overflow-y: visible; padding: 6px 2px 10px; min-height: calc(var(--hand-w) * 1.4 + 16px); scrollbar-width: thin; }

/* ---------- cartas ---------- */
.card { --w: var(--card-w); width: var(--w); height: calc(var(--w) * 1.4); flex: none; border-radius: calc(var(--w) * .06); position: relative; cursor: pointer; user-select: none;
  background: var(--frame); padding: calc(var(--w) * .045); display: grid; grid-template-rows: auto 1fr auto; gap: calc(var(--w) * .03);
  box-shadow: 0 2px 6px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.12); transition: transform .18s, box-shadow .18s, opacity .2s; color: var(--card-ink); font-size: calc(var(--w) * .095); }
.card.W { --frame: linear-gradient(160deg, #efe8d6, #b9b09a); } .card.U { --frame: linear-gradient(160deg, #3d70bd, #213f72); }
.card.B { --frame: linear-gradient(160deg, #4a4253, #241f2a); } .card.R { --frame: linear-gradient(160deg, #c64a3c, #7d241c); }
.card.G { --frame: linear-gradient(160deg, #3a8b58, #1d4e30); } .card.L { --frame: linear-gradient(160deg, #a08e69, #5f533c); }
.card.M { --frame: linear-gradient(160deg, #c4a352, #7a6127); }
.card .top { background: var(--parch); border-radius: 3px; padding: .15em .3em; min-width: 0; min-height: 2.3em; display: flex; align-items: center; }
.card .nm { font-family: var(--f-name); font-weight: 700; font-size: 1em; line-height: 1.05; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.card .cc { position: absolute; top: 4%; right: 4%; }
.card .cc .pip { width: calc(var(--w) * .15); height: calc(var(--w) * .15); font-size: calc(var(--w) * .1); }
.card.big .cc .pip { width: 24px; height: 24px; font-size: 14px; }
.card .art { border-radius: 3px; display: grid; place-items: center; min-height: 0; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 40%, var(--artA), var(--artB)); }
.card.W .art { --artA: #fffaf0; --artB: #cdbf9a; --emb: #6d5a2e; } .card.U .art { --artA: #c9dcf5; --artB: #6c93cb; --emb: #13284b; }
.card.B .art { --artA: #b1a6bb; --artB: #5f566a; --emb: #17131b; } .card.R .art { --artA: #f5c3a7; --artB: #c9624c; --emb: #4a120c; }
.card.G .art { --artA: #cfe6c3; --artB: #6fa87a; --emb: #133a20; } .card.L .art, .card.M .art { --artA: #efe2c2; --artB: #a99367; --emb: #3c3120; }
.card .art svg { width: 62%; height: 62%; fill: var(--emb); color: var(--emb); --card-ink: var(--artA); }
.card .bot { display: flex; justify-content: space-between; align-items: center; gap: 2px; background: var(--parch); border-radius: 3px; padding: .1em .3em; min-height: 1.5em; }
.card .tl { font-family: var(--f-ui); font-size: .78em; color: #5a4d3a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .pt { font-family: var(--f-ui); font-weight: 800; font-size: 1.05em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .pt.up { color: #1f6b33; } .card .pt.down { color: #a3261b; }
.card .kws { position: absolute; left: 4%; bottom: 4%; display: grid; gap: 2px; justify-items: start; }
.kw { font-family: var(--f-ui); font-weight: 700; font-size: calc(var(--w) * .075); background: rgba(20,16,10,.78); color: #f3e6c4; border-radius: 3px; padding: 0 .3em; line-height: 1.5; letter-spacing: .02em; }
.card .txt { display: none; }
.card .rar { position: absolute; right: 7%; bottom: 7%; width: calc(var(--w) * .09); height: calc(var(--w) * .09); transform: rotate(45deg); background: var(--gold-hi); box-shadow: 0 0 0 1px #5b4413; }
.card .dmg { position: absolute; right: calc(var(--w) * .06); bottom: calc(var(--w) * .26); background: var(--danger); color: #fff; font: 800 calc(var(--w) * .1)/1.25 var(--f-ui); padding: 0 .35em; border-radius: 3px; }
.card .ctr { position: absolute; left: calc(var(--w) * .06); bottom: calc(var(--w) * .26); background: #1f6b33; color: #fff; font: 800 calc(var(--w) * .1)/1.25 var(--f-ui); padding: 0 .35em; border-radius: 3px; }
.card .badge { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); font: 700 11px/1.5 var(--f-ui); padding: 0 6px; border-radius: 99px; white-space: nowrap; background: var(--gold); color: #1c160c; z-index: 2; }
.card .badge.blk { background: #8a7fb0; color: #120f1c; }
.card .info { position: absolute; right: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: #0f1115; color: var(--gold-hi); border: 1px solid var(--line-2); font: 700 12px/20px var(--f-ui); text-align: center; z-index: 3; padding: 0; cursor: pointer; }
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.2); }
.card.tapped { transform: rotate(10deg) translateY(2px); opacity: .72; }
.card.tapped:hover { transform: rotate(10deg) translateY(-1px); }
.card.sick .art::after { content: "zZ"; position: absolute; left: 6%; top: 4%; z-index: 2; font: 800 calc(var(--w) * .1) var(--f-ui); color: #f3e6c4; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.card.playable { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 14px rgba(233,205,130,.55); }
.card.selectable { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 12px rgba(233,205,130,.5); }
.card.selected { box-shadow: 0 0 0 3px #f7e7b3, 0 0 18px rgba(247,231,179,.75); transform: translateY(-8px); }
.card.attacking { box-shadow: 0 0 0 3px var(--danger), 0 0 16px rgba(224,97,79,.6); }
.card.dim { opacity: .45; }
.card.big { --w: min(300px, 78vw); font-size: calc(var(--w) * .062); cursor: default; padding: calc(var(--w) * .04); grid-template-rows: auto minmax(0, 1fr) auto auto; height: calc(var(--w) * 1.4); }
.card.big:hover { transform: none; }
.card.big .nm { font-size: 1.35em; }
.card.big .top { min-height: 0; }
.card.big .tl { font-size: .95em; }
.card.big .txt { display: block; background: var(--parch); border-radius: 3px; padding: .5em .6em; font-family: var(--f-body); font-size: 1.05em; line-height: 1.35; color: var(--card-ink); }
.card.big .txt p { margin: 0 0 .35em; } .card.big .txt p:last-child { margin: 0; }
.card.big .txt .k { font-weight: 700; }
.card.big .pt { font-size: 1.4em; }
.card.hand { --w: var(--hand-w); }
.card.land { --w: 48px; height: var(--w); grid-template-rows: 1fr; padding: 3px; border-radius: 6px; }
.card.land .top, .card.land .bot, .card.land .kws { display: none; }
.card.land .art svg { width: 70%; height: 70%; }
.card.land.tapped { transform: rotate(90deg) scale(.9); }
.card.ench { --w: calc(var(--card-w) * .82); }

/* lane de terrenos agrupados */
.landgroup { display: flex; gap: 4px; }

/* ---------- painel lateral ---------- */
.side { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.tabs { display: flex; gap: 4px; }
.tab { font-family: var(--f-ui); font-size: 13px; font-weight: 600; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--line-2); background: var(--table-2); }
.tabs .spacer { flex: 1; }
.feed { overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-right: 2px; min-height: 0; }
.msg { border-radius: 8px; padding: 8px 10px; background: var(--table-2); border: 1px solid var(--line); font-size: 14.5px; line-height: 1.42; }
.msg .from { font-family: var(--f-name); font-weight: 700; font-size: 12.5px; letter-spacing: .06em; color: var(--gold); display: block; margin-bottom: 2px; }
.msg.lesson { background: #262214; border-color: #6b5626; }
.msg.lesson .from { color: var(--gold-hi); }
.msg.claude .from { color: #c9b6f2; }
.msg.tip { background: #1d2a1f; border-color: #3d6a43; }
.msg.tip .from { color: var(--ok); }
.msg.sys { background: transparent; border-style: dashed; color: var(--muted); font-size: 13.5px; }
.log { font-family: var(--f-ui); font-size: 13px; line-height: 1.45; display: grid; gap: 3px; }
.log .l { color: var(--muted); } .log .l.me { color: var(--ink); } .log .l.t { color: var(--gold); font-weight: 700; margin-top: 6px; }
.sidefoot { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- modais ---------- */
.veil { position: fixed; inset: 0; background: rgba(6,7,10,.72); display: grid; place-items: center; z-index: 50; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 18px; max-width: min(760px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.modal h3 { margin: 0; font-family: var(--f-name); font-size: 18px; letter-spacing: .04em; color: var(--gold-hi); text-wrap: balance; }
.modal p { margin: 0; color: var(--muted); }
.modal .cards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.inspect { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; }
.inspect .side2 { display: grid; gap: 10px; min-width: 0; }
.inspect .side2 .note { font-size: 14px; color: var(--muted); }
.inspect .side2 .gloss { font-size: 14px; display: grid; gap: 6px; }
.inspect .side2 .gloss b { color: var(--gold-hi); font-family: var(--f-name); }
.choice { display: grid; justify-items: center; gap: 6px; }
.choice .tg { display: flex; gap: 4px; }
.rules { max-width: 70ch; display: grid; gap: 10px; color: var(--ink); }

.gallery .hint { color: var(--muted); font-family: var(--f-ui); font-size: 13px; }

/* =========================================================
   MESA v2 — três colunas: jogadores | campo | prévia e ações
   ========================================================= */

  background: radial-gradient(900px 500px at 50% 50%, #1e222b 0%, #171a21 70%); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 0; overflow: hidden; }

/* jogadores */

.avatar.W { --rim: #e9dfc0; } .avatar.U { --rim: #5b8fe0; } .avatar.B { --rim: #9b8db0; } .avatar.R { --rim: #e0614f; } .avatar.G { --rim: #5aa66f; }

.lifeb { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); min-width: 56px; padding: 2px 10px; border-radius: 99px; background: #0f1115; border: 2px solid var(--rim, var(--gold));
  font: 800 22px/1.15 var(--f-ui); color: var(--ink); font-variant-numeric: tabular-nums; text-align: center; }

/* campo */

.midpill.combat { border-color: #8a3a2f; background: #24171a; } .midpill.combat b { color: #f0a090; }

/* carta compacta */
.pcard { --pw: 108px; width: var(--pw); height: calc(var(--pw) * 1.36); flex: none; border-radius: 9px; background: #12151b; border: 1.5px solid var(--frm, var(--line-2)); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; cursor: pointer; position: relative; transition: transform .16s, box-shadow .16s, opacity .2s; }
.pcard.W { --frm: #cfc4a3; --tint: rgba(233,223,192,.16); } .pcard.U { --frm: #4f7fc8; --tint: rgba(79,127,200,.2); } .pcard.B { --frm: #7d6f92; --tint: rgba(125,111,146,.22); }

.pcard .pa { position: relative; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, var(--tint), transparent 75%); overflow: hidden; }
.pcard .pa svg { width: 52%; height: 52%; fill: var(--frm); color: var(--frm); --card-ink: #12151b; opacity: .9; }
.pcard .pa .artimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.ptc { font: 800 13px/1 var(--f-ui); font-variant-numeric: tabular-nums; padding: 3px 7px; border-radius: 99px; background: #1d2129; border: 1px solid var(--line-2); color: var(--ink); white-space: nowrap; }
.ptc.up { color: #8fd18a; border-color: #3d6a43; } .ptc.down { color: #f08a7c; border-color: #7a3a32; } .ptc.ench { font-size: 10px; font-weight: 600; color: var(--muted); }
.pcard .tag { position: absolute; top: 5px; left: 5px; z-index: 2; font: 700 9.5px/1.5 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; padding: 0 5px; border-radius: 3px; background: #b5382b; color: #fff; }
.pcard .tag.new { background: rgba(15,17,21,.85); color: #c9c2b0; border: 1px solid var(--line-2); }
.pcard .tag.blk { background: #6f63a0; }
.pcard .cnt, .pcard .dmgc { position: absolute; bottom: 4px; z-index: 2; font: 800 11px/1.4 var(--f-ui); padding: 0 5px; border-radius: 3px; }
.pcard .cnt { left: 4px; background: #1f6b33; color: #fff; } .pcard .dmgc { right: 4px; background: var(--danger); color: #fff; }
.pcard:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,.5); }
.pcard.tapped { transform: rotate(7deg); opacity: .6; }
.pcard.tapped:hover { transform: rotate(7deg) translateY(-2px); opacity: .85; }
.pcard.attacking { border-color: #e0614f; box-shadow: 0 0 0 1px #e0614f, 0 0 18px rgba(224,97,79,.55); }
.pcard.selectable { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 14px rgba(233,205,130,.5); }

.pcard.playable { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 12px rgba(233,205,130,.45); }
.pcard.dim { opacity: .38; }

/* terrenos agrupados */
.lgroup { position: relative; width: 52px; height: 56px; border-radius: 9px; border: 1.5px solid var(--frm, var(--line-2)); background: #12151b; cursor: pointer; overflow: visible; transition: transform .16s, opacity .2s; }
.lgroup.W { --frm: #cfc4a3; } .lgroup.U { --frm: #4f7fc8; } .lgroup.B { --frm: #7d6f92; } .lgroup.R { --frm: #c0503f; } .lgroup.G { --frm: #4f9a67; } .lgroup.M { --frm: #a8893f; }
.lgroup .la { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; display: grid; place-items: center; }
.lgroup .la svg { width: 60%; height: 60%; fill: var(--frm); --card-ink: #12151b; }
.lgroup .la .artimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lgroup .la:has(.artimg) svg { visibility: hidden; }
.lgroup .lc { position: absolute; top: -8px; right: -8px; font: 800 11px/1.5 var(--f-ui); padding: 0 6px; border-radius: 99px; background: #0f1115; border: 1px solid var(--line-2); color: var(--ink); font-variant-numeric: tabular-nums; }
.lgroup:hover { transform: translateY(-2px); }

.lgroup.tapped:hover { transform: rotate(12deg) scale(.92) translateY(-2px); opacity: .8; }

/* mão em leque */
.hand2 { display: flex; justify-content: center; align-items: flex-end; padding: 18px 20px 0; min-height: calc(var(--hand-w) * 1.4 * .78); margin-bottom: calc(var(--hand-w) * -0.32); overflow: visible; }

.ccol .banners { display: grid; gap: 6px; }

/* painel deslizante de conversa/registro */

.dhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* telas menores */
@media (max-width: 1180px) { .table { grid-template-columns: 180px minmax(0, 1fr) 236px; } .preview .card.big { --w: 206px; } .pcard { --pw: 96px; } .avatar { width: 88px; height: 88px; } }

  .pblock.me { grid-template-columns: auto 1fr; }
  .pblock.me .avatar { grid-column: 1; grid-row: 1 / span 3; }
  .pblock.me .pname, .pblock.me .psub, .pblock.me .zrow { grid-column: 2; justify-self: start; }
  .pblock.me .pname { grid-row: 1; margin-top: 0; } .pblock.me .psub { grid-row: 2; } .pblock.me .zrow { grid-row: 3; margin: 0; justify-content: flex-start; }
  .pcard .tag { font-size: 8px; letter-spacing: .02em; }
}
.hand2 .fan { margin-left: calc(var(--hand-w) * var(--ov, .22) * -1); }
.hand2 .fan:first-child { margin-left: 0; }
@media (max-width: 1180px) and (min-width: 921px) { :root { --hand-w: 104px; } }
@media (max-width: 920px) { .hand2 .fan { margin-left: 6px; } }

/* ---------- mesa em perspectiva + animações ---------- */
.ccol { grid-template-rows: minmax(0, 1fr) auto auto; perspective: 1600px;
  background:
    radial-gradient(700px 260px at 50% 78%, rgba(201,161,74,var(--glow-me,0)), transparent 70%),
    radial-gradient(700px 260px at 50% 18%, rgba(138,127,176,var(--glow-opp,0)), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 96px),
    radial-gradient(900px 500px at 50% 50%, #20242d 0%, #15181e 75%); }
.ccol:has(.battle.turn-me) { --glow-me: .10; } .ccol:has(.battle.turn-opp) { --glow-opp: .10; }
.battle { display: grid; grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 6px; min-height: 0; transform: rotateX(9deg); transform-origin: 50% 70%; transform-style: preserve-3d; }
.battle .pcard { box-shadow: 0 10px 18px -8px rgba(0,0,0,.7); }
.ghosts { position: fixed; inset: 0; pointer-events: none; z-index: 45; }
.fxghost { position: fixed; }
.fxghost > * { width: 100%; height: 100%; }
.floatnum { position: fixed; font: 800 26px/1 var(--f-ui); letter-spacing: -.02em; text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 14px rgba(0,0,0,.6); white-space: nowrap; }
.floatnum.dmg { color: #ff7a66; } .floatnum.heal { color: #8fe08a; }
@media (max-width: 920px) { .battle { transform: none; display: flex; flex-direction: column; gap: 8px; } .ccol { perspective: none; } }
@media (prefers-reduced-motion: reduce) { .battle { transform: none; } }

/* fundo da mesa: arte de pedra com rosa dos ventos (horizontal no computador, vertical no celular) */
.ccol {
  background:
    radial-gradient(700px 260px at 50% 80%, rgba(201,161,74,var(--glow-me,0)), transparent 70%),
    radial-gradient(700px 260px at 50% 16%, rgba(138,127,176,var(--glow-opp,0)), transparent 70%),
    radial-gradient(ellipse at 50% 50%, rgba(10,12,16,.28) 0%, rgba(10,12,16,.10) 60%, rgba(10,12,16,0) 100%),
    url("art/mesa-h.jpg") center / cover no-repeat,
    #15181e;
  border-color: #2a2418;
}
.ccol:has(.battle.turn-me) { --glow-me: .14; } .ccol:has(.battle.turn-opp) { --glow-opp: .14; }
.midpill { background: rgba(18,20,26,.88); backdrop-filter: blur(2px); }
.rempty, .lempty { color: #cfc6b0; opacity: .55; text-shadow: 0 1px 2px #000; }
@media (max-width: 920px) {
  .ccol { background:
    radial-gradient(ellipse at 50% 50%, rgba(10,12,16,.3) 0%, rgba(10,12,16,.12) 70%),
    url("art/mesa-v.jpg") center top / cover repeat-y,
    #15181e; }
}

/* ===== sinalização de turno, fase e combate ===== */
/* turno: foco no próprio campo */
.battle .crow { padding: 14px 4px; }
.battle .crow.opp, .battle .lrow.opp, .battle .crow.me, .battle .lrow.me { transition: none; }
@media (min-width: 921px) {
  .battle.turn-me { grid-template-rows: auto minmax(0, .8fr) auto minmax(0, 1.2fr) auto; }
  .battle.turn-me .crow.opp, .battle.turn-me .lrow.opp { scale: .86; }
  .ccol:has(.battle.turn-opp) .hand2 { translate: 0 22px; filter: brightness(.82) saturate(.85); }
  .ccol:has(.battle.turn-opp) .hand2:hover, .ccol:has(.battle.turn-opp) .hand2:focus-within { translate: 0 0; filter: none; }
}
@media (max-width: 920px) { .battle.turn-me .crow.opp { scale: .92; } }
.battle.turn-me .crow.opp, .battle.turn-me .lrow.opp { opacity: .78; filter: saturate(.7) brightness(.88); }
.battle.turn-me .crow.opp:hover, .battle.turn-me .crow.opp:focus-within, .battle.turn-me .crow.opp:has(.selectable) { opacity: 1; filter: none; }
.ccol:has(.battle.turn-me) { --glow-me: .22; } .ccol:has(.battle.turn-opp) { --glow-opp: .22; }

/* anel no avatar de quem joga */
.avatar.active::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--ring); box-shadow: 0 0 22px var(--ringglow), inset 0 0 12px var(--ringglow); pointer-events: none;
  animation: ringpulse 1.6s ease-in-out infinite; animation-delay: var(--sync, 0ms); }
.pblock.me .avatar.active { --ring: #f3d98e; --ringglow: rgba(243,217,142,.55); }
.pblock.opp .avatar.active { --ring: #b9a8ee; --ringglow: rgba(185,168,238,.5); }
@keyframes ringpulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
.avatar .incoming { position: absolute; top: -6px; right: -14px; z-index: 3; font: 800 17px/1 var(--f-ui); padding: 5px 8px; border-radius: 99px; background: #b5382b; color: #fff; border: 2px solid #ffb3a6; box-shadow: 0 0 16px rgba(224,97,79,.7);
  animation: incpulse 1.6s ease-in-out infinite; animation-delay: var(--sync, 0ms); font-variant-numeric: tabular-nums; }
@keyframes incpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* faixa central: cor de quem joga */
.midpill.me { border-color: #8a7438; } .midpill.me b { color: #f3d98e; }
.midpill.opp { border-color: #5d5390; } .midpill.opp b { color: #c9bcf2; }
.midpill.combat { border-color: #b5382b; background: rgba(40,16,16,.92); box-shadow: 0 0 18px rgba(224,97,79,.35); } .midpill.combat b { color: #ffab9c; }
.midline::before { transform-origin: 50% 50%; }
.ccol:has(.midpill.combat) { box-shadow: inset 0 0 0 1px rgba(224,97,79,.55), inset 0 0 150px rgba(150,30,20,.5); }
.vphases li { transition: background .3s; border-radius: 6px; }

/* faixa de início de turno */
.turnban { position: fixed; height: 92px; display: grid; place-items: center; pointer-events: none; z-index: 46; transform-origin: 50% 0;
  background: linear-gradient(90deg, transparent, var(--tb-bg) 18%, var(--tb-bg) 82%, transparent); border-block: 1px solid transparent;
  border-image: linear-gradient(90deg, transparent, var(--tb-line), transparent) 1; }
.turnban.me { --tb-bg: rgba(40,31,12,.9); --tb-line: #e9cd82; --tb-ink: #f6e3a6; }
.turnban.opp { --tb-bg: rgba(26,22,44,.9); --tb-line: #a99ad8; --tb-ink: #d6cbff; }
.turnban .tbin { display: grid; justify-items: center; gap: 2px; }
.turnban b { font: 700 clamp(22px, 3.4vw, 38px)/1.05 var(--f-name); letter-spacing: .16em; text-transform: uppercase; color: var(--tb-ink); text-shadow: 0 0 18px var(--tb-line), 0 2px 0 rgba(0,0,0,.6); white-space: nowrap; }
.turnban small { font: 600 12px var(--f-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--tb-ink); opacity: .75; }

/* combate: atacantes avançam, selo com espada */
.battle .crow.me .pcard.attacking { translate: 0 -12px; }
.battle .crow.opp .pcard.attacking { translate: 0 12px; }
.pcard.attacking.tapped { opacity: 1; }
.pcard.attacking { border-color: #ff6a55; box-shadow: 0 0 0 2px #e0614f, 0 0 22px rgba(255,90,70,.65), 0 10px 18px -8px rgba(0,0,0,.7); }
.pcard .tag.atk { display: inline-flex; align-items: center; gap: 3px; background: #c43a2a; box-shadow: 0 0 8px rgba(255,90,70,.6); }
.pcard .tag.atk svg { width: 11px; height: 11px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pcard .tag.blk { background: #6f63a0; }
.crow.me .pcard .tag.blk { background: #a8863a; color: #1c160c; }
.crow.opp .pcard.attacking.selectable { animation: atkpulse 1.6s ease-in-out infinite; animation-delay: var(--sync, 0ms); }
@keyframes atkpulse { 0%, 100% { box-shadow: 0 0 0 2px #f3d98e, 0 0 10px rgba(243,217,142,.4); } 50% { box-shadow: 0 0 0 4px #f3d98e, 0 0 28px rgba(243,217,142,.85); } }

/* setas */
.arrows { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 44; overflow: visible; }
.arw path { fill: none; stroke-linecap: round; }
.arw .glow { stroke-width: 11; opacity: .28; filter: blur(3px); }
.arw .ln { stroke-width: 3.5; }
.arw.me .ln, .arw.me .glow, .arw.me .dot { stroke: #f3d98e; fill: none; } .arw.me .dot { fill: #f3d98e; }
.arw.opp .ln, .arw.opp .glow { stroke: #b9a8ee; } .arw.opp .dot { fill: #b9a8ee; }
.arw.atk .ln { stroke: #ff7a66; stroke-dasharray: 9 7; animation: march .7s linear infinite; } .arw.atk .glow { stroke: #ff5a46; opacity: .22; } .arw.atk .dot { fill: #ff7a66; }
@keyframes march { to { stroke-dashoffset: -16; } }
@media (prefers-reduced-motion: reduce) { .arw.atk .ln, .avatar.active::after, .avatar .incoming, .crow.opp .pcard.attacking.selectable { animation: none; } }
.battle .pcard.selectable { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 14px rgba(233,205,130,.5); }
.battle .pcard.selected { box-shadow: 0 0 0 3px #f7e7b3, 0 0 22px rgba(247,231,179,.8); }
.battle .pcard.playable { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 12px rgba(233,205,130,.45); }
.battle .crow.me .pcard.selected { translate: 0 -8px; }
/* a mesa inclinada não precisa de 3D nos filhos — com preserve-3d o clique nas cartas caía no contêiner */
.battle { transform-style: flat; }

/* ===== coluna do duelo (lateral esquerda) ===== */
.lcol.duel {
  --slate: #12151b;
  position: relative; justify-content: space-between; gap: 0; padding: 18px 12px 16px; border-radius: 14px;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .62  0 0 0 0 .66  0 0 0 0 .74  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.07'/></svg>"),
    radial-gradient(120% 60% at 50% 0%, rgba(120,110,170,.06), transparent 60%),
    radial-gradient(120% 60% at 50% 100%, rgba(201,161,74,.05), transparent 60%),
    linear-gradient(180deg, #14171d, #101318);
  border: 1px solid rgba(201,161,74,.32);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.03), 0 10px 30px -12px rgba(0,0,0,.7);
}
.lcol.duel::before { content: ""; position: absolute; inset: 5px; border-radius: 10px; border: 1px solid rgba(0,0,0,.55); box-shadow: 0 1px 0 rgba(255,255,255,.025), inset 0 1px 0 rgba(255,255,255,.025); pointer-events: none; }
.lcol.duel .pblock { gap: 5px; position: relative; }

/* medalhão com acabamento de metal; a cor interna identifica o lado */
.lcol.duel .avatar { border-width: 2px; box-shadow: 0 0 18px -6px var(--rim, var(--gold)), inset 0 0 18px rgba(0,0,0,.6); background: radial-gradient(circle at 50% 35%, #2b303b, #14171d 72%); }
.lcol.duel .avatar::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 210deg, #6b5427, #e9cd82, #8a6c30, #f3e2ac, #5e4a22, #c9a14a, #6b5427);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px));
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.7)); opacity: .9; }
.lcol.duel .lifeb { background: linear-gradient(180deg, #1b1f27, #0d0f13); border: 1.5px solid #b8944a; box-shadow: 0 2px 6px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); color: #f4ead2; }
.lcol.duel .pname { font-size: 17px; letter-spacing: .05em; margin-top: 12px; }
.lcol.duel .psub { font-size: 12px; color: #8f897b; margin-top: -2px; }
.lcol.duel .avatar.active::after { inset: -13px; }

/* mão do oponente: cartinhas viradas */
.lcol.duel .ohand { gap: 3px; margin-top: 4px; }
.lcol.duel .ohand .cback { width: 13px; height: 19px; border-radius: 2px; background: linear-gradient(160deg, #3b3150, #211b2e); border: 1px solid #6a5a8c; box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.lcol.duel .ohand:has(.cback:nth-child(9)) .cback { margin-left: -5px; } .lcol.duel .ohand .cback:first-child { margin-left: 0; }
.lcol.duel .hcount { font: 700 13px var(--f-ui); color: #c9c0aa; margin-left: 6px; }

/* contadores: ícone + número, sem cápsula */
.zrow2 { display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 2px; }
.zc { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 2px 3px; border-radius: 6px; color: var(--ink); font: 700 15px/1 var(--f-ui); font-variant-numeric: tabular-nums; cursor: default; }
button.zc { cursor: pointer; } button.zc:hover { background: rgba(255,255,255,.05); } button.zc:hover svg { stroke: var(--gold-hi); }
.zc svg { width: 17px; height: 17px; fill: none; stroke: #a59d89; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.zc.warn b { color: var(--danger); } .zc.warn svg { stroke: var(--danger); }
.lcol.duel .pblock.me .zrow2 { margin-bottom: 10px; }

/* divisórias gravadas na pedra */
.engr { position: relative; height: 2px; margin: 12px 6px; background: linear-gradient(90deg, transparent, rgba(0,0,0,.75) 15%, rgba(0,0,0,.75) 85%, transparent); }
.engr::before { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.05) 15%, rgba(255,255,255,.05) 85%, transparent); }
.engr::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; transform: translate(-50%, -50%) rotate(45deg); background: #101318; border: 1px solid rgba(201,161,74,.5); box-shadow: 0 0 6px rgba(201,161,74,.2); }

/* núcleo: mana disponível como placa de pedra */
.manacore { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 12px 8px 11px; border-radius: 10px;
  background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.12)); box-shadow: inset 0 2px 6px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.035); }
.mtitle { font: 700 11px var(--f-name); letter-spacing: .2em; text-transform: uppercase; color: #b39350; }
.gems { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 170px; }
.gem { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 38% 32%, rgba(255,255,255,.55), transparent 38%), linear-gradient(135deg, var(--c1) 50%, var(--c2) 50%);
  box-shadow: 0 0 10px -1px var(--c1), inset 0 -3px 5px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.5); }
.gem svg { width: 15px; height: 15px; fill: rgba(15,17,21,.85); }
.gem b { font: 800 13px var(--f-ui); color: #1b1712; }
.gem.used { background: linear-gradient(135deg, #2a2f39, #1c2028); box-shadow: inset 0 2px 4px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05); }
.gem.used svg { fill: #4b5260; } .gem.used b { color: #4b5260; }
.gems.many .gem { width: 24px; height: 24px; } .gems.many .gem svg { width: 12px; height: 12px; }
.mcount { display: flex; align-items: baseline; gap: 5px; }
.mcount b { font: 800 26px/1 var(--f-ui); color: #f4ead2; font-variant-numeric: tabular-nums; }
.mcount span { font-size: 12px; color: var(--muted); }
.lnote { display: inline-flex; align-items: center; gap: 6px; font: 400 11.5px/1.3 var(--f-ui); color: #857f72; }
.lnote i { width: 7px; height: 7px; border-radius: 50%; background: #3b404a; flex: none; }
.lnote.on { color: #cbbf9f; } .lnote.on i { background: var(--gold-hi); box-shadow: 0 0 7px var(--gold-hi); }
.mnone { font-size: 12px; color: var(--muted); }
.lcol.duel .say { font-style: italic; font-size: 12.5px; color: #c8bfa8; border-left: 2px solid rgba(201,161,74,.35); padding-left: 8px; text-align: left; margin-top: 6px; }

/* celular: a coluna se divide em faixa do oponente (topo) e faixa do jogador (abaixo do campo) */
@media (max-width: 920px) {
  .lcol.duel { display: contents; }
  .lcol.duel .engr { display: none; }
  .lcol.duel .pblock { border-radius: 12px; padding: 10px 12px; background: linear-gradient(180deg, #14171d, #101318); border: 1px solid rgba(201,161,74,.25);
    grid-template-columns: auto 1fr; justify-items: start; text-align: left; column-gap: 14px; row-gap: 3px; align-items: center; }
  .lcol.duel .pblock.opp { order: 1; }
  .lcol.duel .pblock.opp .avatar { grid-row: span 5; }
  .lcol.duel .pblock.me { order: 3; }
  .lcol.duel .pblock.me .zrow2 { order: 3; margin: 0; grid-column: 2; }
  .lcol.duel .pblock.me .avatar { grid-row: 1 / span 3; grid-column: 1; }
  .lcol.duel .pblock.me .pname { grid-column: 2; grid-row: 1; } .lcol.duel .pblock.me .psub { grid-column: 2; grid-row: 2; }
  .lcol.duel .pname { margin-top: 0; font-size: 15px; }
  .lcol.duel .zrow2 { justify-content: flex-start; gap: 12px; }
  .lcol.duel .avatar::before { inset: -5px; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); }
  .manacore { order: 4; grid-template-columns: auto 1fr; grid-template-areas: "t t" "g c" "n n"; justify-items: start; text-align: left; padding: 10px 12px; border: 1px solid rgba(201,161,74,.18); background: linear-gradient(180deg, #14171d, #101318); }
  .mtitle { grid-area: t; } .gems { grid-area: g; justify-content: flex-start; max-width: none; } .mcount { grid-area: c; justify-self: end; } .lnote { grid-area: n; }
  .stackbox { order: 5; } .actbox { order: 6; } .turnbox { order: 7; } .rfoot { order: 8; }
}

/* avatares (planeswalkers) */
.avatar .avimg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 28%; }
.avatar.hasav { background: #0f1115; }
.avatar .avbadge { position: absolute; top: -2px; right: -6px; z-index: 2; display: flex; gap: 1px; padding: 2px; border-radius: 99px; background: #0f1115; border: 1.5px solid #b8944a; box-shadow: 0 2px 5px rgba(0,0,0,.6); }
.avatar .avbadge .pip { width: 18px; height: 18px; }
.avatar.hasav .lifeb { z-index: 2; }
@media (max-width: 920px) { .avatar .avbadge .pip { width: 14px; height: 14px; } }

/* ===== conselheira (modo Aprendiz) ===== */
.advline { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; cursor: pointer;
  background: linear-gradient(180deg, rgba(201,161,74,.14), rgba(201,161,74,.05)); border: 1px solid rgba(201,161,74,.45); color: var(--ink); font: inherit; }
.advline:hover { border-color: var(--gold-hi); }
.advline img, .advline .advdot { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; object-position: 50% 28%; flex: none; border: 1.5px solid #b8944a; box-shadow: 0 0 10px rgba(201,161,74,.35); }
.advline .advdot { background: radial-gradient(circle, #e9cd82, #6b5427); }
.advtxt { display: grid; gap: 2px; min-width: 0; }
.advtxt b { font: 700 13.5px/1.25 var(--f-ui); color: #f3e2ac; }
.advtxt small { font: 400 12px/1.3 var(--f-ui); color: #b9b09a; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.advline.loading b { color: #cfc6b0; font-weight: 600; }
.advline.loading img { animation: advpulse 1.2s ease-in-out infinite; }
@keyframes advpulse { 50% { box-shadow: 0 0 18px rgba(243,217,142,.9); } }

/* carta sugerida */
.card.advised, .pcard.advised { outline: 2px solid #f3d98e; outline-offset: 2px; }
.card.advised::after, .pcard.advised::after { content: "Conselho"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); z-index: 4; font: 700 9.5px/1.6 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; padding: 0 6px; border-radius: 99px; background: #f3d98e; color: #1c160c; box-shadow: 0 2px 6px rgba(0,0,0,.5); white-space: nowrap; pointer-events: none; }
.pcard.advised::after { top: auto; bottom: 30px; }

/* chat */
.msg.adv { position: relative; padding-left: 46px; border-left: 2px solid rgba(201,161,74,.6); background: rgba(201,161,74,.07); }
.msg.adv .mav { position: absolute; left: 6px; top: 6px; width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: 50% 28%; border: 1.5px solid #b8944a; }
.msg.adv .from { color: #e9cd82; }
.drawer .sidefoot { display: flex; gap: 6px; flex-wrap: wrap; }
.drawer .sidefoot .btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); }

/* relatório no fim */
.advrep { border: 1px solid rgba(201,161,74,.45); border-radius: 10px; padding: 10px 12px; background: rgba(201,161,74,.07); display: grid; gap: 4px; }
.advrep b { font-family: var(--f-name); color: var(--gold-hi); }
.advrep p { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.45; }
.advrep p.wait { color: var(--muted); font-style: italic; }
@media (prefers-reduced-motion: reduce) { .advline.loading img { animation: none; } }

.feed { grid-auto-rows: max-content; }
.msg.adv .mav + .from { display: block; min-height: 0; }
@media (max-width: 920px) { .hand2 .card.advised::after { top: auto; bottom: 26px; } }

/* ---------- conversa com a conselheira ---------- */
.drawer:has(.askbox) { grid-template-rows: auto minmax(0, 1fr) auto auto; }
.askbox { display: grid; gap: 6px; border-top: 1px solid var(--line-2); padding-top: 8px; }
.askbox .chips { display: flex; gap: 5px; flex-wrap: wrap; }
.askbox .chip { font: 600 12px/1 var(--f-ui); color: #e9cd82; background: rgba(201,161,74,.08); border: 1px solid rgba(201,161,74,.45); border-radius: 99px; padding: 6px 10px; cursor: pointer; }
.askbox .chip:hover:not([disabled]) { background: rgba(201,161,74,.18); }
.askbox .chip[disabled] { opacity: .45; cursor: default; }
.askrow { display: flex; gap: 6px; }
.askrow input { flex: 1; min-width: 0; font: 400 14px/1.3 var(--f-ui); color: var(--ink); background: #0f1115; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; }
.askrow input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,161,74,.25); }
.askrow input[disabled] { opacity: .6; }
.askhint { margin: 0; font: 400 11px/1.3 var(--f-ui); color: var(--ink-3, #8a8f99); }
.msg.me { margin-left: 18%; background: rgba(79,127,200,.12); border-right: 2px solid rgba(79,127,200,.7); }
.msg.me .from { color: #9dbbe8; }
.msg.wait { opacity: .7; font-style: italic; animation: askpulse 1.2s ease-in-out infinite; }
@keyframes askpulse { 50% { opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .msg.wait { animation: none; } }
@media (max-width: 560px) { .askrow input { font-size: 16px; } }

/* ---------- campo lotado: cartas encolhem para caber numa linha ---------- */
.battle .crow[style*="--rowpw"] { flex-wrap: nowrap; overflow: visible; }
.battle .crow[style*="--rowpw"] > .pcard { --pw: var(--rowpw); }
.battle .crow.tight .pcard .pn { font-size: 9.5px; }
.battle .crow.tight .pcard .pf { padding: 3px 4px; }
@media (min-width: 921px) { .battle.turn-me .crow.opp, .battle.turn-me .lrow.opp { scale: .94; } .battle.turn-me .lrow.opp { scale: 1; } }

/* ---------- fim de partida ---------- */
.endscr { position: fixed; inset: 0; z-index: 60; overflow-y: auto; overflow-x: hidden; background: #07080c; color: var(--ink); }
.endbg { position: fixed; inset: -2%; background: #0b0d14 center / cover no-repeat; animation: endbg 1.1s ease-out both, endzoom 18s ease-out both; }
.endscr::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 70% 55% at 50% 34%, transparent 0 40%, rgba(5,6,10,.55) 100%); }
.endscr.win .endbg { filter: brightness(1.15) saturate(1.05); }
.endscr.draw .endbg { filter: grayscale(.6) brightness(.95); }
.endwrap { position: relative; z-index: 2; min-height: 100%; display: grid; justify-items: center; align-content: center; gap: 10px; padding: max(18px, env(safe-area-inset-top, 0px)) 16px max(18px, env(safe-area-inset-bottom, 0px)); }
.crest { --cw: min(720px, 92vw); position: relative; width: var(--cw); display: grid; }
.crest > img { width: 100%; height: auto; display: block; grid-area: 1 / 1; filter: drop-shadow(0 18px 40px rgba(0,0,0,.6)); }
.crest .shine { grid-area: 1 / 1; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.75) 48%, rgba(255,240,200,.25) 54%, transparent 64%) no-repeat; background-size: 300% 100%; background-position: 130% 0; mix-blend-mode: screen; pointer-events: none; }
.crest .cglow { position: absolute; inset: -20% -10%; z-index: -1; background: radial-gradient(ellipse 50% 45% at 50% 50%, rgba(255,214,140,.55), rgba(120,160,255,.18) 45%, transparent 70%); filter: blur(10px); }
.crestt { position: absolute; left: 50%; top: 47%; translate: -50% -50%; font-family: var(--f-display); font-weight: 400; font-size: calc(var(--cw) * .1); line-height: 1; letter-spacing: .04em; white-space: nowrap; text-transform: uppercase;
  background: linear-gradient(180deg, #fff6d8 0%, #f0cf7a 45%, #b9822f 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(60,20,10,.85)) drop-shadow(0 0 14px rgba(255,200,110,.45)); }
.endscr.loss .crest { --cw: min(620px, 92vw); }
.endscr.loss .crestt { top: 36%; font-size: calc(var(--cw) * .1); background: linear-gradient(180deg, #e9eef7 0%, #9fb0c8 50%, #56657d 100%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 2px 0 rgba(5,10,25,.9)) drop-shadow(0 0 12px rgba(90,150,255,.35)); }
.endscr.loss .cglow { background: radial-gradient(ellipse 50% 40% at 50% 38%, rgba(70,120,220,.35), transparent 70%); }
.endscr.draw .crest > img { filter: grayscale(.85) brightness(.9) drop-shadow(0 18px 40px rgba(0,0,0,.6)); }
.endscr.draw .crestt { background: linear-gradient(180deg, #f2f2f2, #a9a9a9); -webkit-background-clip: text; background-clip: text; }
.endreason { margin: 0; text-align: center; font: 500 16px/1.4 var(--f-ui); color: #e6e2d6; text-shadow: 0 1px 6px rgba(0,0,0,.8); max-width: 560px; }
.endpanel { width: min(680px, 100%); display: grid; gap: 12px; padding: 14px; border-radius: 14px; background: rgba(14,16,22,.78); border: 1px solid rgba(233,205,130,.25); backdrop-filter: blur(6px); box-shadow: 0 20px 60px rgba(0,0,0,.55); }
.endscr.loss .endpanel { border-color: rgba(120,150,200,.28); }
.endpanel .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.endpanel .stats div { background: rgba(255,255,255,.04); }
.motes { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.motes i { position: absolute; left: var(--x); bottom: -10px; width: var(--s); height: var(--s); border-radius: 50%; background: #ffb35c; box-shadow: 0 0 8px 2px rgba(255,150,60,.7); opacity: 0; animation: moteup var(--t) linear var(--d) infinite; }
.endscr.loss .motes i { top: -10px; bottom: auto; background: #8c8f98; box-shadow: none; border-radius: 1px; animation-name: motedown; }
.endscr.loss .motes i:nth-child(4n) { background: #e0503c; box-shadow: 0 0 6px 1px rgba(224,80,60,.6); border-radius: 50%; }
@keyframes moteup { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -95vh); } }
@keyframes motedown { 0% { opacity: 0; transform: translate(0, 0) rotate(0); } 15% { opacity: .9; } 100% { opacity: 0; transform: translate(var(--dx), 95vh) rotate(260deg); } }
@keyframes endbg { from { opacity: 0; } to { opacity: 1; } }
@keyframes endzoom { from { transform: scale(1.08); } to { transform: scale(1); } }
/* entrada do brasão */
.endscr.win .crest, .endscr.draw .crest { animation: crestin .9s cubic-bezier(.2,1.4,.35,1) .15s both; }
.endscr.win .crest .shine { animation: shine 1.4s ease-in-out 1s both, shine 1.4s ease-in-out 4.5s both; }
.endscr.win .cglow { animation: glowp 3s ease-in-out 1s infinite; }
.endscr.loss .crest { animation: crestfall 1.1s cubic-bezier(.3,.0,.2,1) .15s both; }
.crestt { animation: titlein .8s ease-out .55s both; }
.endreason { animation: fadeup .6s ease-out 1s both; }
.endpanel { animation: fadeup .7s ease-out 1.25s both; }
@keyframes crestin { 0% { opacity: 0; transform: scale(.35); filter: blur(8px) brightness(2.5); } 60% { opacity: 1; transform: scale(1.07); filter: blur(0) brightness(1.4); } 100% { transform: scale(1); filter: none; } }
@keyframes crestfall { 0% { opacity: 0; transform: translateY(-60px) rotate(-2deg); } 55% { opacity: 1; transform: translateY(8px) rotate(.6deg); } 70% { transform: translateY(-3px) rotate(-.4deg); } 100% { transform: none; } }
@keyframes titlein { from { opacity: 0; letter-spacing: .5em; } to { opacity: 1; letter-spacing: .04em; } }
@keyframes shine { from { background-position: 130% 0; } to { background-position: -30% 0; } }
@keyframes glowp { 50% { opacity: .55; transform: scale(.96); } }
@keyframes fadeup { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@media (max-width: 560px) { .endpanel { padding: 10px; } .endpanel .stats { grid-template-columns: repeat(2, 1fr); } .endreason { font-size: 14px; } .endpanel .foot .btn { flex: 1 1 auto; } }
@media (prefers-reduced-motion: reduce) { .endscr *, .endbg { animation: none !important; } .motes { display: none; } }
.endscr.loss .crest { margin-bottom: calc(var(--cw) * -.16); } .endscr.loss .endreason { position: relative; z-index: 1; }
/* título do fim de partida: Cinzel, mais legível que a gótica */
.crestt { font-family: "Cinzel", "Alegreya SC", Georgia, serif; font-weight: 900; font-size: calc(var(--cw) * .072); letter-spacing: .08em; }
.endscr.loss .crestt { font-size: calc(var(--cw) * .074); }
@keyframes titlein { from { opacity: 0; letter-spacing: .45em; } to { opacity: 1; letter-spacing: .08em; } }
.crestt { line-height: 1.4; padding: .12em .1em 0; }

/* ---------- combate voraz e projéteis ---------- */
.pcard.flying { visibility: hidden; }
.ghosts .flyer { position: fixed; margin: 0; z-index: 2; will-change: transform; box-shadow: 0 18px 40px -10px rgba(0,0,0,.8), 0 0 0 1.5px rgba(255,220,150,.35); }
.ghosts .flyer.dying { z-index: 1; }
.fxburst { position: fixed; mix-blend-mode: screen; pointer-events: none; z-index: 3; }
.fxproj { position: fixed; background: center / 100% 100% no-repeat; mix-blend-mode: screen; pointer-events: none; z-index: 3; will-change: transform; }
.fxproj.cB::before { content: ""; position: absolute; inset: 18% 4% 18% 10%; border-radius: 50%; background: radial-gradient(ellipse at 85% 50%, rgba(0,0,0,.85), rgba(10,0,5,.55) 45%, transparent 75%); filter: blur(8px); mix-blend-mode: normal; z-index: -1; }
.floatnum.big { font-size: 44px; font-weight: 900; color: #ff5a44; -webkit-text-stroke: 1.5px rgba(40,5,0,.85); text-shadow: 0 3px 0 rgba(0,0,0,.7), 0 0 18px rgba(255,90,40,.7); z-index: 4; }
.ghosts .ash { position: fixed; width: 4px; height: 4px; border-radius: 1px; background: #3a3633; box-shadow: 0 0 3px rgba(255,120,60,.4); }
.ghosts .ash:nth-child(3n) { background: #c9643a; }
.jolt { animation: jolt .26s ease-out; }
@keyframes jolt { 25% { translate: 0 3px; } 50% { translate: -2px -2px; } 75% { translate: 1px 1px; } }
.fxlayer { position: fixed; inset: 0; pointer-events: none; z-index: 46; mix-blend-mode: screen; }
.fxlayer .fxburst, .fxlayer .fxproj { mix-blend-mode: normal; }
.ghosts .floatnum.big { z-index: 5; }
.floatnum.big { position: fixed; z-index: 47; pointer-events: none; }
.ghosts .fxsmoke { position: fixed; pointer-events: none; border-radius: 50%; background: radial-gradient(ellipse 60% 50% at 82% 50%, rgba(0,0,0,.9), rgba(15,0,8,.6) 50%, transparent 78%); filter: blur(10px); }

/* ================= campo compacto (estilo Arena) ================= */
/* carta de campo: só arte, nome numa faixa fina e força/resistência sobre a arte */
.pcard { height: calc(var(--pw) * 1.2); display: block; }
.pcard .pa { position: absolute; inset: 0; }
.pcard .pn { position: absolute; top: 0; left: 0; right: 0; z-index: 2; font-size: 10.5px; padding: 3px 5px 6px; background: linear-gradient(180deg, rgba(9,11,15,.92) 55%, rgba(9,11,15,0)); border-bottom: 0; text-shadow: 0 1px 2px #000; }
.pcard .pf { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 12px 4px 4px; background: linear-gradient(0deg, rgba(9,11,15,.92) 30%, rgba(9,11,15,0)); border-top: 0; }
.pcard .kwrow svg { filter: drop-shadow(0 1px 1px #000); }
.pcard .ptc { background: rgba(15,17,22,.9); }
.pcard .tag { top: 21px; }
.pcard .cnt, .pcard .dmgc { bottom: 27px; }
.battle .crow.tight .pcard .pn { font-size: 9px; padding: 2px 4px 5px; }

/* bordas do campo: terrenos à esquerda, avatar no centro, grimório e mão à direita */
.edge { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; min-height: 0; padding: 0 6px; }
.edge .lrow { justify-content: flex-start; min-height: 0; flex-wrap: nowrap; gap: 14px; padding-left: 4px; }
.edge .piles { display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding-right: 4px; }
.fav { display: grid; justify-items: center; }
.fav .pname, .fav .psub { display: none; }
.fav .avatar { width: 80px; height: 80px; border-width: 2.5px; }
.fav .lifeb { font-size: 17px; min-width: 44px; bottom: -11px; padding: 1px 8px; }
.fav .avatar .avbadge .pip { width: 15px; height: 15px; }
.fav .avatar .incoming { font-size: 14px; padding: 4px 6px; right: -18px; }
@media (min-width: 921px) {
  .lcol.duel .pblock .avatar { display: none; }
  .lcol.duel .pblock .pname { font-size: 20px; }
  .lcol.duel .ohand { display: none; }
}
@media (max-width: 920px) { .fav, .edge .piles { display: none; } .edge { display: block; } .edge .lrow { justify-content: center; flex-wrap: wrap; } }

/* terrenos como pequenas cartas empilhadas em leque */
.lgroup { width: 46px; height: 62px; border-radius: 6px; isolation: isolate; }
.lgroup .la { border-radius: 5px; }
.lgroup::before, .lgroup::after { content: ""; position: absolute; inset: -1.5px; border-radius: 6px; border: 1.5px solid var(--frm); background: #12151b; z-index: -1; display: none; }
.lgroup[data-n="2"]::before, .lgroup[data-n="3"]::before { display: block; transform: translate(6px, -4px); }
.lgroup[data-n="3"]::after { display: block; transform: translate(12px, -8px); opacity: .85; }
.lgroup .lc { top: auto; bottom: -8px; right: -10px; z-index: 3; }
.lgroup.tapped { transform: rotate(14deg) scale(.95); }
.lgroup.tapped:hover { transform: rotate(14deg) scale(.95) translateY(-2px); }
.battle.turn-me .lrow.opp { opacity: 1; filter: none; }

/* grimório (pilha) e mão do oponente (versos) */
.pile { position: relative; width: 46px; height: 64px; flex: none; }
.pile .pb { position: absolute; inset: 0; border-radius: 5px; background: linear-gradient(160deg, #22305a, #121a33) center / cover; border: 1px solid #b8944a; box-shadow: 0 3px 8px rgba(0,0,0,.6); }
.pile .pb.s1 { transform: translate(3px, 3px); filter: brightness(.7); }
.pile .pb.s2 { transform: translate(6px, 6px); filter: brightness(.5); }
.pile b, .ohand2 b { position: absolute; bottom: -8px; left: 50%; translate: -50% 0; z-index: 2; font: 800 12px/1.5 var(--f-ui); padding: 0 7px; border-radius: 99px; background: #0f1115; border: 1px solid var(--line-2); color: var(--ink); font-variant-numeric: tabular-nums; }
.pile.warn b { color: #ff9a88; border-color: #7a3a32; }
.ohand2 { position: relative; width: 92px; height: 56px; flex: none; }
.ohand2 .hb { position: absolute; left: 50%; top: 4px; width: 32px; height: 46px; margin-left: -16px; border-radius: 3px; background: linear-gradient(160deg, #22305a, #121a33) center / cover; border: 1px solid #b8944a; box-shadow: 0 2px 5px rgba(0,0,0,.6); transform-origin: 50% 160%; transform: rotate(calc(var(--i) * 9deg)); }
@media (min-width: 921px) {
  .lcol.duel .pblock .avatar { display: grid; width: 76px; height: 76px; margin: 0 auto 6px; }
  .lcol.duel .pblock .avatar .lifeb, .lcol.duel .pblock .avatar .incoming, .lcol.duel .pblock .avatar::after { display: none; }
  .lcol.duel .pblock .avatar.target { box-shadow: none; }
}

/* ---------- botões redondos do turno (entre a mão e a barra lateral) ---------- */
.ccol { position: relative; }
.tdock { position: absolute; right: 14px; bottom: 16px; z-index: 30; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.dockb { position: relative; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0;
  background: radial-gradient(circle at 50% 35%, #2b303b, #12151b 72%); border: 2px solid #b8944a;
  box-shadow: 0 0 0 3px rgba(10,11,15,.85), 0 6px 16px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.12); transition: transform .15s, box-shadow .2s, filter .2s; }
.dockb svg { width: 26px; height: 26px; fill: none; stroke: #e9cd82; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dockb .dl { position: absolute; right: calc(100% + 10px); top: 50%; translate: 0 -50%; white-space: nowrap; font: 700 12px/1 var(--f-name); letter-spacing: .06em; color: #f4ead2; background: rgba(12,14,19,.92); border: 1px solid rgba(184,148,74,.5); padding: 6px 9px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .15s; }
.dockb:hover:not([disabled]), .dockb:focus-visible { transform: scale(1.08); filter: brightness(1.15); }
.dockb:hover .dl, .dockb:focus-visible .dl { opacity: 1; }
.dockb[disabled] { cursor: default; filter: grayscale(.9) brightness(.55); }
.dockb.cmb:not([disabled]) { width: 68px; height: 68px; background: radial-gradient(circle at 50% 35%, #8a2a1f, #3d0f0a 75%); border-color: #f0b25a; box-shadow: 0 0 0 3px rgba(10,11,15,.85), 0 0 22px rgba(224,97,79,.55), 0 6px 16px rgba(0,0,0,.65); animation: dockpulse 2s ease-in-out infinite; }
.dockb.cmb:not([disabled]) svg { stroke: #ffe3b0; width: 30px; height: 30px; }
.dockb.end:not([disabled]) { background: radial-gradient(circle at 50% 35%, #6d5524, #2a2010 75%); }
.dockb.flag { width: 44px; height: 44px; border-color: #6b6f7a; }
.dockb.flag svg { width: 20px; height: 20px; stroke: #b9bcc5; }
@keyframes dockpulse { 50% { box-shadow: 0 0 0 3px rgba(10,11,15,.85), 0 0 34px rgba(224,97,79,.8), 0 6px 16px rgba(0,0,0,.65); } }
@media (max-width: 920px) {
  .tdock { position: fixed; right: 10px; bottom: auto; top: 50%; translate: 0 -50%; flex-direction: column; gap: 8px; }
  .dockb { width: 48px; height: 48px; } .dockb.cmb:not([disabled]) { width: 54px; height: 54px; } .dockb.flag { width: 38px; height: 38px; }
  .dockb .dl { display: none; }
}
@media (prefers-reduced-motion: reduce) { .dockb.cmb { animation: none !important; } }
@media (max-width: 920px) {
  .table:has(.drawer) .tdock { right: auto; left: 8px; z-index: 45; }
  .table:has(.tdock) .drawer { width: calc(100vw - 76px); }
}
.dockb .dn { position: absolute; top: -4px; right: -4px; font: 800 11px/18px var(--f-ui); font-style: normal; min-width: 18px; height: 18px; border-radius: 9px; background: #f0b25a; color: #2a1405; }
.dockb.nxt.go { background: radial-gradient(circle at 50% 35%, #3a4a6a, #141c2c 75%); border-color: #e9cd82; width: 64px; height: 64px; box-shadow: 0 0 0 3px rgba(10,11,15,.85), 0 0 18px rgba(233,205,130,.35), 0 6px 16px rgba(0,0,0,.65); }
.dockb.cmb.blk:not([disabled]) { background: radial-gradient(circle at 50% 35%, #5d4a8a, #1e1730 75%); border-color: #c9b3ff; box-shadow: 0 0 0 3px rgba(10,11,15,.85), 0 0 22px rgba(160,130,240,.5), 0 6px 16px rgba(0,0,0,.65); animation: none; }
.actbox .actions:empty { display: none; }
@media (max-width: 920px) { .dockb.nxt.go { width: 52px; height: 52px; } }
/* todos do mesmo tamanho; o destaque é só cor e brilho */
.tdock { gap: 9px; }
.dockb, .dockb.flag, .dockb.cmb:not([disabled]), .dockb.nxt.go { width: 52px; height: 52px; }
.dockb svg, .dockb.cmb:not([disabled]) svg, .dockb.flag svg { width: 24px; height: 24px; }
@media (max-width: 920px) {
  .tdock { gap: 7px; right: 6px; }
  .dockb, .dockb.flag, .dockb.cmb:not([disabled]), .dockb.nxt.go { width: 42px; height: 42px; }
  .dockb svg, .dockb.cmb:not([disabled]) svg, .dockb.flag svg { width: 20px; height: 20px; }
  .dockb { box-shadow: 0 0 0 2px rgba(10,11,15,.85), 0 4px 10px rgba(0,0,0,.6); }
}
/* moldura de metal gravado (imagem) nos botões do turno */
